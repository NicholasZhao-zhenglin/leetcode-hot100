", "约因素就是相邻的房屋装有相互连通的防盗系统，如果两间相邻的房屋在同一晚上被小偷闯入，", "系统会自动报警。给定一个代表每个房屋存放金额的非负整数数组，计算你不触动警报装置的情", "况下，一夜之内能够偷窃到的最高金额。", "示例：", "输入：nums = [1,2,3,1]", "输出：4", "解释：偷窃 1 号房屋（金额 = 1），然后偷窃 3 号房屋（金额 = 3），总金额 = 4。"]}, {"title": "解题思路", "paragraphs": ["经典的选择型 DP：对每间房，要么偷、要么不偷，且不能偷相邻的。", "状态定义：dp[i] 表示「考虑前 i 间房时能偷到的最大金额」。", "转移方程：dp[i] = max(dp[i-1], dp[i-2] + nums[i-1])。", "含义：", "- 不偷第 i 间：最大金额就是 dp[i-1]。", "- 偷第 i 间：那第 i-1 间不能偷，最大金额是 dp[i-2] + 当前金额。", "两者取最大。", "初始条件：dp[0] = 0（没有房子），dp[1] = nums[0]。", "同样可以滚动变量优化到 O(1) 空间：用两个变量分别表示 dp[i-2] 和 dp[i-1]。", "理解重点：**「不能相邻」这个约束，正是通过 dp[i-2] 体现出来的**。看到「相邻不能同时选」", "的题目，都可以往这个模板上套。"]}, {"title": "参考代码", "code": "# 标准 DP\ndef rob(nums):\n    n = len(nums)\n    if n == 0:\n        return 0\n    if n == 1:\n        return nums[0]\n    dp = [0] * (n + 1)\n    dp[1] = nums[0]\n    for i in range(2, n + 1):\n        dp[i] = max(dp[i - 1], dp[i - 2] + nums[i - 1])\n    return dp[n]\n\n# 空间优化: 滚动变量\ndef rob2(nums):\n    prev2, prev1 = 0, 0      # dp[i-2], dp[i-1]\n    for x in nums:\n        prev2, prev1 = prev1, max(prev1, prev2 + x)\n    return prev1"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n)：一次遍历。空间复杂度：数组版本 O(n)，滚动变量版本 O(1)。"]}, {"title": "核心知识点", "paragraphs": ["• 「选或不选」型 DP：核心是列出「选当前」和「不选当前」两种情况的转移。", "• 相邻约束的建模：通过跳过一个状态（dp[i-2]）表达「不能相邻」的限制。", "• 滚动变量优化：只依赖前两个状态，可省掉数组。", "• 「不相邻子序列最大和」的通用性：同类约束的问题都可套此模板。", "• 衍生题：打家劫舍 II（213）房屋成环，需分「偷第一间」和「不偷第一间」两种情况讨论；打家", "劫舍 III（337）在二叉树上做，需要树形 DP（返回两个值：偷/不偷该结点的最大收益）。"]}]}, {"id": 279, "title": "完全平方数", "difficulty": "中等", "category": 15, "page": 160, "sections": [{"title": "题目描述", "paragraphs": ["给你一个整数 n，返回和为 n 的完全平方数的最少数量。完全平方数是一个整数，其值等于另一", "个整数的平方；换句话说，其值等于一个整数自乘的积。例如，1、4、9 和 16 都是完全平方数，", "而 3 和 11 不是。", "示例：", "输入：n = 12", "输出：3", "解释：12 = 4 + 4 + 4", "输入：n = 13", "输出：2", "解释：13 = 4 + 9"]}, {"title": "解题思路", "paragraphs": ["这是「完全背包」问题的变形：物品是各个完全平方数（1, 4, 9, 16, ...），每个物品可以无限次", "使用，目标是「恰好凑出 n，且物品数量最少」。", "状态定义：dp[i] 表示「凑出 i 所需的最少完全平方数个数」。", "转移方程：dp[i] = min(dp[i - j*j] + 1)，其中 j*j <= i。", "含义：从 i 中减去一个完全平方数 j*j，剩下的 i-j*j 用最优方案凑出，再加上这一个数。", "初始条件：dp[0] = 0，其余初始化为一个大数（表示暂时无法凑出）。", "具体步骤：", "1. dp = [∞] * (n+1)，dp[0] = 0。", "2. i 从 1 到 n：对每个 j 从 1 开始、j*j <= i，dp[i] = min(dp[i], dp[i - j*j] + 1)。", "3. 返回 dp[n]。", "遍历顺序说明：外层遍历「容量 i」、内层遍历「物品 j*j」，这种顺序允许同一物品被重复使用，", "所以叫「完全背包」。（0-1 背包则反过来，外层物品、内层容量倒序。）"]}, {"title": "参考代码", "code": "def numSquares(n):\n    dp = [float('inf')] * (n + 1)\n    dp[0] = 0                        # 凑出 0 需要 0 个数\n    for i in range(1, n + 1):        # 遍历容量\n        j = 1\n        while j * j <= i:            # 遍历物品(完全平方数)\n            dp[i] = min(dp[i], dp[i - j * j] + 1)\n            j += 1\n    return dp[n]\n\n# 进阶: 数学解法 (拉格朗日四平方和定理), O(sqrt(n))\ndef numSquares_math(n):\n    # 若 n 本身是完全平方数, 答案 1\n    if int(n ** 0.5) ** 2 == n:\n        return 1\n    # 若 n = 4^a * (8b + 7), 答案 4\n    m = n\n    while m % 4 == 0:\n        m //= 4\n    if m % 8 == 7:\n        return 4\n    # 检查能否表示为两个平方数之和\n    j = 1\n    while j * j <= n:\n        rest = n - j * j\n        if int(rest ** 0.5) ** 2 == rest:\n            return 2\n        j += 1\n    return 3"}, {"title": "复杂度分析", "paragraphs": ["DP 解法：时间复杂度 O(n√n)，空间复杂度 O(n)。数学解法：时间 O(√n)，空间 O(1)。"]}, {"title": "核心知识点", "paragraphs": ["• 完全背包模型：物品可无限次使用，「恰好凑出目标值」是这类问题的标志性描述。", "• 状态定义要包含「目标量」：dp[i] 表示凑出 i 的最优解，i 就是「容量」。", "• min 类型的 DP：初始化要用「无穷大」表示「尚不可达」。", "• 循环顺序的含义：外层容量、内层物品 → 完全背包（可重复）；外层物品、内层容量倒序 → 0-1", "背包（不可重复）。", "• 数学定理（拉格朗日四平方和定理）：任何正整数都可表示为不超过 4 个完全平方数之和，所以", "答案只可能是 1、2、3、4。"]}]}, {"id": 322, "title": "零钱兑换", "difficulty": "中等", "category": 15, "page": 162, "sections": [{"title": "题目描述", "paragraphs": ["给你一个整数数组 coins，表示不同面额的硬币；以及一个整数 amount，表示总金额。计算并", "返回可以凑成总金额所需的最少的硬币个数。如果没有任何一种硬币组合能组成总金额，返回 -1。", "你可以认为每种硬币的数量是无限的。", "示例：", "输入：coins = [1,2,5], amount = 11", "输出：3", "解释：11 = 5 + 5 + 1"]}, {"title": "解题思路", "paragraphs": ["这是完全背包问题的标准形式：每种硬币可以用无限次，求「凑出 amount 的最少硬币数」。", "状态定义：dp[i] 表示「凑出金额 i 所需的最少硬币数」。", "转移方程：dp[i] = min(dp[i - coin] + 1)，对所有满足 coin <= i 的硬币面额取最小。", "含义：最后一枚硬币的面额是 coin，那么前面的 i - coin 用最优方案凑出。", "初始条件：dp[0] = 0，其余为 ∞。", "具体步骤：", "1. dp = [∞] * (amount+1)，dp[0] = 0。", "2. i 从 1 到 amount：遍历每种 coin，若 coin <= i，则 dp[i] = min(dp[i], dp[i-coin] + 1)。", "3. 返回 dp[amount]（若是 ∞ 则返回 -1）。", "与「完全平方数」的对比：两者的框架完全一致，只是「物品」不同——一个是完全平方数，一", "个是给定面额的硬币。这就是 DP 的「模型迁移」。"]}, {"title": "参考代码", "code": "def coinChange(coins, amount):\n    dp = [float('inf')] * (amount + 1)\n    dp[0] = 0\n    for i in range(1, amount + 1):\n        for coin in coins:\n            if coin <= i:\n                dp[i] = min(dp[i], dp[i - coin] + 1)\n    return dp[amount] if dp[amount] != float('inf') else -1"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(amount × n)，n 为硬币种类数。空间复杂度 O(amount)。"]}, {"title": "核心知识点", "paragraphs": ["• 完全背包的「最少硬币数」变体：与「完全平方数」同源，是必掌握的 DP 模型。", "• 无穷大初始化的意义：区分「这里还没找到合法方案」与「凑出需要 0 个硬币」。", "• 最后要判断是否可达：dp[amount] 仍为 ∞ 说明无解，返回 -1。", "• 为什么不能用贪心：贪心（每次选最大面额）在一般面额体系下会出错，例如 coins = [1,3,4]、", "amount = 6，贪心得 4+1+1 = 3 枚，而最优是 3+3 = 2 枚。", "• 复杂度权衡：内层也可以写成「遍历 coin / 遍历 i」的顺序，效果相同。"]}]}, {"id": 139, "title": "单词拆分", "difficulty": "中等", "category": 15, "page": 164, "sections": [{"title": "题目描述", "paragraphs": ["给你一个字符串 s 和一个字符串列表 wordDict 作为字典。如果可以利用字典中出现的一个或多", "个单词拼接出 s 则返回 true。注意：不要求字典中出现的单词全部都使用，并且字典中的单词可", "以重复使用。", "示例：", "输入：s = \"leetcode\", wordDict = [\"leet\",\"code\"]", "输出：true", "解释：返回 true 因为 \"leetcode\" 可以由 \"leet\" 和 \"code\" 拼接成。"]}, {"title": "解题思路", "paragraphs": ["把问题看成「字符串切分」：dp[i] 表示「s 的前 i 个字符能否被字典中的单词拼出」。", "转移方程：dp[i] = True，当且仅当存在某个 j < i，使得 dp[j] 为 True 且 s[j:i] 在字典中。", "含义：如果前 j 个字符可以被拼出，且剩下的 s[j:i] 恰好是一个字典单词，那么前 i 个字符也可以", "被拼出。", "初始条件：dp[0] = True（空字符串可以被拼出）。", "具体步骤：", "1. 把 wordDict 转成 set（查找 O(1)）。", "2. dp = [False] * (n+1)，dp[0] = True。", "3. i 从 1 到 n：j 从 0 到 i-1，若 dp[j] 为 True 且 s[j:i] 在字典中，则 dp[i] = True 并 break。", "4. 返回 dp[n]。", "优化：内层循环 j 可以从后往前遍历，或者限制 j >= i - maxLen（maxLen 是字典单词的最长长", "度），避免检查不可能的长度，能提升效率。"]}, {"title": "参考代码", "code": "def wordBreak(s, wordDict):\n    words = set(wordDict)              # 转集合, 查找 O(1)\n    n = len(s)\n    dp = [False] * (n + 1)\n    dp[0] = True                       # 空串可以被拼出\n    max_len = max((len(w) for w in wordDict), default=0)\n    for i in range(1, n + 1):\n        # 优化: j 只需回看 max_len 个字符\n        for j in range(max(0, i - max_len), i):\n            if dp[j] and s[j:i] in words:\n                dp[i] = True\n                break\n    return dp[n]"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n² × L)（不做优化时），L 为子串比较长度；优化后为 O(n × maxLen × L)。空间复杂", "度 O(n)。"]}, {"title": "核心知识点", "paragraphs": ["• 「前缀可达性」型 DP：dp[i] 表示「前缀 i 是否可行」，是字符串切分类问题的标准状态定义。", "• 切分点枚举：用「枚举上一个切分位置 j」来表达「最后一次拼接的单词」。", "• 用 set 加速查找：把 list 转 set，查找从 O(k) 降到 O(1)。", "• dp[0] = True 的必要性：代表「空字符串天然可行」，是所有切分点枚举的起点。", "• 优化技巧：用最长单词长度限制 j 的回看范围，避免无效检查。", "• 同类题：单词拆分 II（140）要求输出所有方案，需要用回溯 + 记忆化。"]}]}, {"id": 300, "title": "最长递增子序列", "difficulty": "中等", "category": 15, "page": 166, "sections": [{"title": "题目描述", "paragraphs": ["给你一个整数数组 nums，找到其中最长严格递增子序列的长度。子序列是由数组派生而来的序", "列，删除（或不删除）数组中的元素而不改变其余元素的顺序。例如，[3,6,2,7] 是数组", "[0,3,1,6,2,2,7] 的子序列。", "示例：", "输入：nums = [10,9,2,5,3,7,101,18]", "输出：4", "解释：最长递增子序列是 [2,3,7,101]，因此长度为 4。"]}, {"title": "解题思路", "paragraphs": ["方法一（经典 O(n²) DP，最易理解）：", "状态定义：dp[i] 表示「以 nums[i] 结尾的最长严格递增子序列的长度」。", "转移方程：dp[i] = max(dp[j] + 1)，对所有 j < i 且 nums[j] < nums[i]。", "初始条件：dp[i] = 1（每个元素自身构成一个长度为 1 的子序列）。", "答案是 max(dp)。", "方法二（贪心 + 二分，O(n log n)，进阶）：", "维护一个数组 tails，tails[k] 表示「长度为 k+1 的递增子序列的末尾元素的最小值」。这个数组", "本身是严格递增的。遍历每个数字 x 时，用二分查找找到 tails 中第一个 >= x 的位置：", "- 若找到，就用 x 替换它（让该长度的末尾元素更小，更有利于后续延长）。", "- 若没找到（x 比所有都大），就追加到末尾（子序列长度 +1）。", "最终 tails 的长度就是答案。", "「贪心」体现在「尽量让每个长度的末尾元素更小」，「二分」用于快速定位替换位置。"]}, {"title": "参考代码", "code": "# 方法一: 经典 DP (O(n^2), 必掌握)\ndef lengthOfLIS(nums):\n    n = len(nums)\n    if n == 0:\n        return 0\n    dp = [1] * n                       # 每个元素自身长度为 1\n    for i in range(n):\n        for j in range(i):\n            if nums[j] < nums[i]:\n                dp[i] = max(dp[i], dp[j] + 1)\n    return max(dp)\n\n# 方法二: 贪心 + 二分 (O(n log n), 进阶)\nimport bisect\n\ndef lengthOfLIS2(nums):\n    tails = []                         # tails[k] = 长度 k+1 的子序列的最小末尾\n    for x in nums:\n        pos = bisect.bisect_left(tails, x)   # 第一个 >= x 的位置\n        if pos == len(tails):\n            tails.append(x)            # x 比所有都大, 延长\n        else:\n            tails[pos] = x             # 替换, 让末尾更小\n    return len(tails)"}, {"title": "复杂度分析", "paragraphs": ["DP 解法：时间 O(n²)，空间 O(n)。贪心 + 二分：时间 O(n log n)，空间 O(n)。"]}, {"title": "核心知识点", "paragraphs": ["• 「以 i 结尾」的状态定义：子序列类问题几乎都要这样定义，否则无法写出转移方程。", "• O(n²) → O(n log n) 的优化：用「维护单调数组 + 二分」替代「遍历所有前驱」。", "• 贪心的正确性：更小的末尾元素一定不劣于更大的，所以可以放心替换。", "• 注意题目要求「严格递增」，所以 b(search) 用 bisect_left；若允许非严格递增，则用", "bisect_right。", "• tail 数组本身不是答案的子序列，它的长度才是答案 —— 这是初学者常见的误解。", "• 衍生题：俄罗斯套娃信封问题（354）、最长数对链（646）都是 LIS 的应用。"]}]}, {"id": 152, "title": "乘积最大子数组", "difficulty": "中等", "category": 15, "page": 168, "sections": [{"title": "题目描述", "paragraphs": ["给你一个整数数组 nums，请你找出数组中乘积最大的非空连续子数组（该子数组中至少包含一", "个数字），并返回该子数组所对应的乘积。测试用例的答案是一个 32-位整数。子数组是数组的", "连续子序列。", "示例：", "输入：nums = [2,3,-2,4]", "输出：6", "解释：子数组 [2,3] 有最大乘积 6。"]}, {"title": "解题思路", "paragraphs": ["本题与「最大子数组和」很像，但有个关键区别：**负数的存在**。", "一个很大的负数乘以一个负数会变成很大的正数，所以「最小值」也可能变成「最大值」。", "因此需要**同时维护两个状态**：", "- max_dp[i]：以 i 结尾的子数组的最大乘积。", "- min_dp[i]：以 i 结尾的子数组的最小乘积（可能是很负的数）。", "转移方程：设 a = max_dp[i-1] * nums[i]，b = min_dp[i-1] * nums[i]，c = nums[i]。", "- max_dp[i] = max(a, b, c)", "- min_dp[i] = min(a, b, c)", "（三个候选：接在前面的最大乘积后面、接在最小乘积后面、或者自己另起一段。）", "最终答案是 max(max_dp)。", "由于只用到了前一组状态，可以滚动成变量，空间 O(1)。"]}, {"title": "参考代码", "code": "def maxProduct(nums):\n    # 同时维护以当前位置结尾的最大乘积和最小乘积\n    max_dp = min_dp = nums[0]\n    ans = nums[0]\n    for x in nums[1:]:\n        a, b = max_dp * x, min_dp * x\n        max_dp = max(a, b, x)      # 三个候选取最大\n        min_dp = min(a, b, x)      # 三个候选取最小\n        ans = max(ans, max_dp)\n    return ans"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n)：一次遍历。空间复杂度 O(1)：只用了常数个变量。"]}, {"title": "核心知识点", "paragraphs": ["• 双状态 DP：因为「负负得正」，必须同时记录最大和最小，这是本题与「最大子数组和」的根本", "差别。", "• 三个候选的含义：接最大、接最小、另起炉灶，缺一不可。", "• 就地滚动：用 max_dp / min_dp 两个变量滚代替数组。", "• 小心变量更新顺序：「另起炉灶」的候选 x 已经包含在原数组里，所以不需要额外的 dp 数组。", "• 同类对比：最大子数组和（53）只需维护一个状态；本题需要两个状态。遇到「乘法/绝对值」类", "问题要警惕符号翻转。"]}]}, {"id": 416, "title": "分割等和子集", "difficulty": "中等", "category": 15, "page": 169, "sections": [{"title": "题目描述", "paragraphs": ["给你一个只包含正整数的非空数组 nums。请你判断是否可以将这个数组分割成两个子集，使得", "两个子集的元素和相等。", "示例：", "输入：nums = [1,5,11,5]", "输出：true", "解释：数组可以分割成 [1,5,5] 和 [11]。"]}, {"title": "解题思路", "paragraphs": ["转化思路：如果能把数组分成两个和相等的子集，那么每个子集的和一定是「总和的一半」。", "于是问题变成：**能否从数组中选出若干数，使它们的和恰好等于 sum/2**？这是一个标准的", "「0-1 背包」问题。", "前置判断：若总和 sum 为奇数，直接返回 False（不可能平分）。", "状态定义：dp[j] 表示「能否用数组中的数凑出和 j」（布尔 DP）。", "转移方程（0-1 背包的逆序遍历）：对每个数字 num，j 从 target 递减到 num：", "dp[j] = dp[j] or dp[j - num]", "含义：凑出 j 有两种方式——不用 num（dp[j] 原本为 True），或用 num（则要求 dp[j-num]", "为 True）。", "为什么 j 要「逆序」遍历？这是 0-1 背包的关键细节：如果正序遍历，dp[j-num] 可能在本次循", "环中已经被更新过（即 num 被用了两次），那就变成了「完全背包」。", "逆序遍历保证每个数字只用一次。", "可以把 dp 数组想象成一维的「可达和集合」，最终看 dp[target] 是否为 True。"]}, {"title": "参考代码", "code": "def canPartition(nums):\n    total = sum(nums)\n    if total % 2 == 1:              # 总和为奇数, 不可能平分\n        return False\n    target = total // 2\n    dp = [False] * (target + 1)\n    dp[0] = True                    # 和为 0 总是可达的\n    for num in nums:                # 遍历物品\n        # 逆序遍历容量, 保证每个数只用一次\n        for j in range(target, num - 1, -1):\n            dp[j] = dp[j] or dp[j - num]\n    return dp[target]"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n × target)，target = sum/2。空间复杂度 O(target)。"]}, {"title": "核心知识点", "paragraphs": ["• 问题转化：把「平分数组」转化为「选出和为 sum/2 的子集」，是 0-1 背包的经典识别方式。", "• 布尔 DP：dp[j] 表示「和 j 是否可达」，比「最大价值」型的背包更容易理解。", "• 0-1 背包的逆序遍历：防止同一个数字被重复使用，是最关键、最容易写错的细节。", "• 空间优化：二维 dp[i][j] 压缩成一维 dp[j]，因为 dp[i] 只依赖 dp[i-1]。", "• 前置剪枝：总和为奇数直接返回 False；若 max(nums) > target 也可提前返回 False。", "• 同类题：最后一块石头的重量 II（1049）、目标和（494）都是 0-1 背包的变体。"]}]}, {"id": 32, "title": "最长有效括号", "difficulty": "困难", "category": 15, "page": 171, "sections": [{"title": "题目描述", "paragraphs": ["给你一个只包含 '(' 和 ')' 的字符串，找出最长有效（格式正确且连续）括号子串的长度。", "示例：", "输入：s = \"(()\"", "输出：2", "输入：s = \")()())\"", "输出：4", "解释：最长有效括号子串是 \"()()\"。"]}, {"title": "解题思路", "paragraphs": ["三种解法，从易到难：", "方法一（栈，O(n) 时间 / O(n) 空间，推荐）：", "栈里存下标，初始压入 -1 作为「最后一个未被匹配的位置」的哨兵。", "遍历字符串：", "- 遇到 '(' ：把下标压栈。", "- 遇到 ')' ：先弹栈；若栈为空，说明这个右括号没有匹配，把当前下标压栈作为新的「基准」；", "若栈非空，则「当前下标 - 栈顶下标」就是以当前位置结尾的最长有效长度。", "方法二（DP，O(n) 时间 / O(n) 空间）：", "dp[i] 表示「以 s[i] 结尾的最长有效括号长度」。", "- 若 s[i] == ')' 且 s[i-1] == '('：dp[i] = dp[i-2] + 2。", "- 若 s[i] == ')' 且 s[i-1] == ')'：若 s[i - dp[i-1] - 1] == '('，则 dp[i] = dp[i-1] + 2 + dp[i -", "dp[i-1] - 2]。", "（含义：跳过前一个有效块，检查它前面的字符是否是 '('。）", "方法三（双向计数，O(n) 时间 / O(1) 空间，最巧妙）：", "正反各扫一遍，用 left / right 分别计数左右括号。正向扫描时，若 right > left 就说明非法，重", "置计数；若 right == left 就更新答案。反向再扫一遍（此时把含义反转），可以处理「左括号过", "多」的情况。"]}, {"title": "参考代码", "code": "# 方法一: 栈 (推荐, 直观)\ndef longestValidParentheses(s):\n    stack = [-1]          # 哨兵: 最后一个未匹配的位置\n    ans = 0\n    for i, ch in enumerate(s):\n        if ch == '(':\n            stack.append(i)\n        else:\n            stack.pop()\n            if not stack:\n                stack.append(i)          # 无匹配, 当前下标成为新基准\n            else:\n                ans = max(ans, i - stack[-1])\n    return ans\n\n# 方法二: 动态规划\ndef longestValidParentheses2(s):\n    n = len(s)\n    dp = [0] * n\n    ans = 0\n    for i in range(1, n):\n        if s[i] != ')':\n            continue\n        if s[i - 1] == '(':\n            dp[i] = (dp[i - 2] if i >= 2 else 0) + 2\n        elif i - dp[i - 1] > 0 and s[i - dp[i - 1] - 1] == '(':\n            prev = dp[i - dp[i - 1] - 2] if i - dp[i - 1] >= 2 else 0\n            dp[i] = dp[i - 1] + 2 + prev\n        ans = max(ans, dp[i])\n    return ans\n\n# 方法三: 双向计数 (空间 O(1), 最巧妙)\ndef longestValidParentheses3(s):\n    def scan(seq):\n        left = right = best = 0\n        for ch in seq:\n            if ch == '(':\n                left += 1\n            else:\n                right += 1\n            if left == right:\n                best = max(best, 2 * right)\n            elif right > left:           # 右括号过多, 非法, 重置\n                left = right = 0\n        return best\n    # 正向 + 反向(把括号对调后正向)\n    return max(scan(s), scan(s[::-1].replace('(', '#').replace(')', '(').replace('#', ')')))"}, {"title": "复杂度分析", "paragraphs": ["栈解法：时间 O(n)，空间 O(n)。DP 解法：时间 O(n)，空间 O(n)。双向计数：时间 O(n)，空间", "O(1)。"]}, {"title": "核心知识点", "paragraphs": ["• 栈 + 哨兵 -1：用「最后一个未匹配位置」作为计算长度的基准，是栈解法的精髓。", "• 「栈为空则压入当前下标」的技巧：相当于把基准推进到新的位置。", "• DP 的两种转移情况：相邻配对、以及「跳过已有有效块后再配对」。", "• 双向计数法：正向扫描处理「右括号过多」，反向扫描处理「左括号过多」，两者取最大。", "• 「最长有效括号」是括号类问题的最难题型，但核心工具仍是栈和 DP，与前两题（20、22）一脉", "相承。"]}]}, {"id": 62, "title": "不同路径", "difficulty": "中等", "category": 16, "page": 174, "sections": [{"title": "题目描述", "paragraphs": ["一个机器人位于一个 m x n 网格的左上角（起始点在下图中标记为 \"Start\"）。机器人每次只能向", "下或者向右移动一步。机器人试图达到网格的右下角。问总共有多少条不同的路径？", "示例：", "输入：m = 3, n = 7", "输出：28"]}, {"title": "解题思路", "paragraphs": ["状态定义：dp[i][j] 表示「从起点走到格子 (i,j) 的路径数」。", "转移方程：dp[i][j] = dp[i-1][j] + dp[i][j-1]。", "含义：到达 (i,j) 只能从上方 (i-1,j) 或左方 (i,j-1) 过来，所以路径数是两者之和。", "初始条件：第一行和第一列都只有 1 条路径（一直向右 / 一直向下）。", "具体步骤：", "1. 建 m×n 的 dp 数组，全部初始化为 1。", "2. i 从 1 到 m-1，j 从 1 到 n-1：dp[i][j] = dp[i-1][j] + dp[i][j-1]。", "3. 返回 dp[m-1][n-1]。", "空间优化（滚动数组）：因为 dp[i][j] 只依赖「上一行同列」和「本行前一列」，所以可以用一维", "数组 dp[j]，在遍历时不断更新：dp[j] = dp[j]（上一行的值）+ dp[j-1]（本行已更新的值）。", "这样空间从 O(m×n) 降到 O(n)。", "数学解法（组合数）：一共要走 (m-1) + (n-1) 步，其中选 (m-1) 步向下，所以答案是 C(m+n-2,", "m-1)。"]}, {"title": "参考代码", "code": "# 二维 DP\ndef uniquePaths(m, n):\n    dp = [[1] * n for _ in range(m)]      # 第一行/第一列都是 1\n    for i in range(1, m):\n        for j in range(1, n):\n            dp[i][j] = dp[i - 1][j] + dp[i][j - 1]\n    return dp[m - 1][n - 1]\n\n# 空间优化: 一维滚动数组 (O(n) 空间)\ndef uniquePaths2(m, n):\n    dp = [1] * n                          # 第一行的初值\n    for i in range(1, m):\n        for j in range(1, n):\n            dp[j] = dp[j] + dp[j - 1]     # dp[j]=上一行, dp[j-1]=本行已更新\n    return dp[n - 1]"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(m×n)。空间复杂度：二维版本 O(m×n)，滚动数组版本 O(n)。"]}, {"title": "核心知识点", "paragraphs": ["• 二维 DP 的状态设计：dp[i][j] 表示「到达该格子的方案数」，是网格路径类问题的标准定义。", "• 「只能从上方或左方来」→ 转移方程是两者相加，这是计数型 DP 的典型形式。", "• 边界初始化：第一行/第一列只有唯一路径，要单独赋值为 1。", "• 滚动数组优化：注意到「只依赖上一行」就可以降维，注意遍历方向要用「本行已更新的值」。", "• 组合数视角：路径问题等价于「在总步数中选出若干步用于某个方向」，与杨辉三角同理。", "• 衍生题：不同路径 II（63）加入障碍物；最小路径和（64）把「计数」换成「求最小和」。"]}]}, {"id": 64, "title": "最小路径和", "difficulty": "中等", "category": 16, "page": 176, "sections": [{"title": "题目描述", "paragraphs": ["给定一个包含非负整数的 m x n 网格 grid，请找出一条从左上角到右下角的路径，使得路径上的", "数字总和为最小。说明：每次只能向下或者向右移动一步。", "示例：", "输入：grid = [[1,3,1],[1,5,1],[4,2,1]]", "输出：7", "解释：路径 1→3→1→1→1 的总和最小。"]}, {"title": "解题思路", "paragraphs": ["与「不同路径」框架完全一致，只是把「求和」换成了「求最小」。", "状态定义：dp[i][j] 表示「从起点走到 (i,j) 的最小路径和」。", "转移方程：dp[i][j] = grid[i][j] + min(dp[i-1][j], dp[i][j-1])。", "初始条件：", "- dp[0][0] = grid[0][0]。", "- 第一行：只能从左边来，dp[0][j] = dp[0][j-1] + grid[0][j]。", "- 第一列：只能从上边来，dp[i][0] = dp[i-1][0] + grid[i][0]。", "也可以在原数组上直接修改（原地 DP），不需要额外空间。", "面试小技巧：先写二维版本，再提到「可以用一维数组滚动优化」，这是展现理解深度的好方式。"]}, {"title": "参考代码", "code": "# 二维 DP\ndef minPathSum(grid):\n    m, n = len(grid), len(grid[0])\n    dp = [[0] * n for _ in range(m)]\n    dp[0][0] = grid[0][0]\n    for j in range(1, n):                 # 第一行\n        dp[0][j] = dp[0][j - 1] + grid[0][j]\n    for i in range(1, m):                 # 第一列\n        dp[i][0] = dp[i - 1][0] + grid[i][0]\n    for i in range(1, m):\n        for j in range(1, n):\n            dp[i][j] = grid[i][j] + min(dp[i - 1][j], dp[i][j - 1])\n    return dp[m - 1][n - 1]\n\n# 空间优化: 一维滚动 (也可直接原地修改 grid)\ndef minPathSum2(grid):\n    m, n = len(grid), len(grid[0])\n    dp = [0] * n\n    dp[0] = grid[0][0]\n    for j in range(1, n):\n        dp[j] = dp[j - 1] + grid[0][j]\n    for i in range(1, m):\n        dp[0] += grid[i][0]               # 第一列只能从上边来\n        for j in range(1, n):\n            dp[j] = grid[i][j] + min(dp[j], dp[j - 1])\n    return dp[n - 1]"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(m×n)。空间复杂度：二维 O(m×n)，滚动数组 O(n)，原地修改 O(1)。"]}, {"title": "核心知识点", "paragraphs": ["• 「最优子结构」：到达某格子的最优路径，一定由「到达其上方或左方的最优路径」延伸而来。", "• 边界初始化：第一行只能向右、第一列只能向下，要单独处理。", "• min 型 DP 的模板：dp[i][j] = 当前代价 + min(两个来源)。", "• 空间优化：一维滚动时，dp[j] 在更新前代表「上一行同列」，更新后代表「本行同列」。", "• 与不同路径（62）的对比：同一模型，一个求方案数（相加），一个求最小代价（取 min）。"]}]}, {"id": 5, "title": "最长回文子串", "difficulty": "中等", "category": 16, "page": 177, "sections": [{"title": "题目描述", "paragraphs": ["给你一个字符串 s，找到 s 中最长的回文子串。", "示例：", "输入：s = \"babad\"", "输出：\"bab\"", "解释：\"aba\" 同样是符合题意的答案。"]}, {"title": "解题思路", "paragraphs": ["方法一（中心扩展，O(n²) 时间 / O(1) 空间，最推荐）：", "回文串的特点是「关于中心对称」。所以可以枚举所有可能的中心，向两边扩展，直到不再是回", "文为止，记录最长的那个。", "中心有两类：", "- 奇数长度回文，中心是 1 个字符（如 \"aba\" 的中心是 'b'）。", "- 偶数长度回文，中心是 2 个字符之间（如 \"abba\" 的中心在两个 'b' 之间）。", "所以要对「以 i 为中心」和「以 i 和 i+1 之间为中心」两种情况进行扩展。", "方法二（DP，O(n²) 时间 / O(n²) 空间）：", "dp[i][j] 表示「s[i..j] 是否为回文」。转移：", "dp[i][j] = (s[i] == s[j]) and (j - i <= 2 or dp[i+1][j-1])", "遍历时 i 从大到小、j 从小到大，保证 dp[i+1][j-1] 已经被计算。", "方法三（Manacher 算法，O(n)）：竞赛级解法，理解难度较大，面试中一般不需要。"]}, {"title": "参考代码", "code": "# 方法一: 中心扩展 (推荐, O(1) 空间)\ndef longestPalindrome(s):\n    if not s:\n        return \"\"\n    start, max_len = 0, 1\n\n    def expand(l, r):            # 从 l,r 向两侧扩展, 返回回文长度\n        while l >= 0 and r < len(s) and s[l] == s[r]:\n            l -= 1\n            r += 1\n        return r - l - 1          # 退出时 l,r 已越界/不匹配, 长度要减 1\n\n    for i in range(len(s)):\n        len1 = expand(i, i)       # 奇数长度中心\n        len2 = expand(i, i + 1)   # 偶数长度中心\n        cur = max(len1, len2)\n        if cur > max_len:\n            max_len = cur\n            start = i - (cur - 1) // 2   # 反推起点\n    return s[start:start + max_len]\n\n# 方法二: 区间 DP\ndef longestPalindrome2(s):\n    n = len(s)\n    if n < 2:\n        return s\n    dp = [[False] * n for _ in range(n)]\n    start, max_len = 0, 1\n    for i in range(n):\n        dp[i][i] = True\n    for i in range(n - 1, -1, -1):\n        for j in range(i + 1, n):\n            if s[i] == s[j] and (j - i <= 2 or dp[i + 1][j - 1]):\n                dp[i][j] = True\n                if j - i + 1 > max_len:\n                    max_len = j - i + 1\n                    start = i\n    return s[start:start + max_len]"}, {"title": "复杂度分析", "paragraphs": ["中心扩展：时间 O(n²)，空间 O(1)。区间 DP：时间 O(n²)，空间 O(n²)。"]}, {"title": "核心知识点", "paragraphs": ["• 中心扩展法：利用回文的对称性，枚举中心后向两侧扩展，是最直观高效的方法。", "• 两类中心：奇数长度（1 个字符）与偶数长度（两个字符之间），缺一不可。", "• 起点反推公式：start = i - (len - 1) // 2，是中心扩展中容易写错的地方，建议画图验证。", "• 区间 DP 的遍历方向：i 倒序、j 正序，保证 dp[i+1][j-1] 已被计算。", "• 回文判定递推式：s[i]==s[j] and (j-i<=2 or dp[i+1][j-1])，是所有回文问题的通用判别公式。"]}]}, {"id": 1143, "title": "最长公共子序列", "difficulty": "中等", "category": 16, "page": 179, "sections": [{"title": "题目描述", "paragraphs": ["给定两个字符串 text1 和 text2，返回这两个字符串的最长公共子序列的长度。如果不存在公共子", "序列，返回 0。一个字符串的子序列是指这样一个新的字符串：它是由原字符串在不改变字符的", "相对顺序的情况下删除某些字符（也可以不删除任何字符）后组成的新字符串。例如，\"ace\" 是", "\"abcde\" 的子序列，但 \"aec\" 不是。两个字符串的公共子序列是这两个字符串所共同拥有的子序", "列。", "示例：", "输入：text1 = \"abcde\", text2 = \"ace\"", "输出：3", "解释：最长公共子序列是 \"ace\"，它的长度为 3。"]}, {"title": "解题思路", "paragraphs": ["这是「双序列 DP」的标杆题目，模板可迁移到大量字符串问题上。", "状态定义：dp[i][j] 表示「text1 的前 i 个字符」与「text2 的前 j 个字符」的最长公共子序列长度。", "转移方程：", "- 若 text1[i-1] == text2[j-1]：dp[i][j] = dp[i-1][j-1] + 1（这个字符可以同时用上）。", "- 否则：dp[i][j] = max(dp[i-1][j], dp[i][j-1])（去掉其中一个末尾字符，取较优）。", "初始条件：dp[0][*] = dp[*][0] = 0（空串与任何串的 LCS 都是 0）。", "具体步骤：", "1. 建 (m+1)×(n+1) 的 dp 数组，全部初始化为 0。", "2. i 从 1 到 m、j 从 1 到 n，按上面的转移方程填充。", "3. 返回 dp[m][n]。", "为什么 dp 数组要多一行一列？因为要表示「空串」的情况，避免下标出现 -1。", "这是双序列 DP 的标准做法。"]}, {"title": "参考代码", "code": "def longestCommonSubsequence(text1, text2):\n    m, n = len(text1), len(text2)\n    # dp[i][j] = text1 前i 个 与 text2 前j 个 的 LCS 长度\n    dp = [[0] * (n + 1) for _ in range(m + 1)]\n    for i in range(1, m + 1):\n        for j in range(1, n + 1):\n            if text1[i - 1] == text2[j - 1]:\n                dp[i][j] = dp[i - 1][j - 1] + 1\n            else:\n                dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])\n    return dp[m][n]"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(m×n)。空间复杂度 O(m×n)，可用滚动数组优化到 O(min(m,n))。"]}, {"title": "核心知识点", "paragraphs": ["• 双序列 DP 的通用模板：dp[i][j] 表示「两个序列各取前 i / 前 j 个」的最优解。", "• 多一行一列的意义：表示空串状态，让下标从 1 开始，避免边界判断。", "• 字符相等则「同时消耗」两个字符（i-1, j-1 转移）；不等则「只消耗一个」（取 max）。", "• 对比「最长公共子串」：子串要求连续，转移方程不同（不等时要清零）。", "• 衍生应用：编辑距离（72）、最长回文子序列（516）、两个字符串的删除操作（583）都基于此", "模板。"]}]}, {"id": 72, "title": "编辑距离", "difficulty": "中等", "category": 16, "page": 181, "sections": [{"title": "题目描述", "paragraphs": ["给你两个单词 word1 和 word2，请返回将 word1 转换成 word2 所使用的最少操作数。你可以", "对一个单词进行如下三种操作：插入一个字符、删除一个字符、替换一个字符。", "示例：", "输入：word1 = \"horse\", word2 = \"ros\"", "输出：3", "解释：horse -> rorse (替换 'h' 为 'r') -> rose (删除 'r') -> ros (删除 'e')"]}, {"title": "解题思路", "paragraphs": ["这是双序列 DP 中最经典的题目，也是 NLP 中计算字符串相似度的基础算法。", "状态定义：dp[i][j] 表示「把 word1 的前 i 个字符变成 word2 的前 j 个字符」所需的最少操作数。", "转移方程：", "- 若 word1[i-1] == word2[j-1]：dp[i][j] = dp[i-1][j-1]（字符相同，无需操作）。", "- 否则：dp[i][j] = 1 + min(", "dp[i-1][j],      # 删除 word1 的一个字符", "dp[i][j-1],      # 在 word1 中插入一个字符", "dp[i-1][j-1]     # 替换一个字符", ")", "初始条件：", "- dp[i][0] = i（把 word1 前 i 个字符变成空串，需要删 i 次）。", "- dp[0][j] = j（把空串变成 word2 前 j 个字符，需要插入 j 次）。", "理解三个操作对应的状态转移：", "- 删除：word1 少一个字符，所以从 dp[i-1][j] 来。", "- 插入：word2 少一个字符（等价于在 word1 里补一个），所以从 dp[i][j-1] 来。", "- 替换：两个都少一个字符，所以从 dp[i-1][j-1] 来。"]}, {"title": "参考代码", "code": "def minDistance(word1, word2):\n    m, n = len(word1), len(word2)\n    # dp[i][j] = word1 前i 个 -> word2 前j 个 的最少操作数\n    dp = [[0] * (n + 1) for _ in range(m + 1)]\n    # 初始化: 变成空串 / 从空串变来\n    for i in range(m + 1):\n        dp[i][0] = i\n    for j in range(n + 1):\n        dp[0][j] = j\n    for i in range(1, m + 1):\n        for j in range(1, n + 1):\n            if word1[i - 1] == word2[j - 1]:\n                dp[i][j] = dp[i - 1][j - 1]      # 字符相同, 无操作\n            else:\n                dp[i][j] = 1 + min(\n                    dp[i - 1][j],                # 删除\n                    dp[i][j - 1],                # 插入\n                    dp[i - 1][j - 1],            # 替换\n                )\n    return dp[m][n]"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(m×n)。空间复杂度 O(m×n)，可用滚动数组优化到 O(n)。"]}, {"title": "核心知识点", "paragraphs": ["• 编辑距离（Levenshtein Distance）：字符串相似度度量的经典算法，应用广泛（拼写纠错、", "DNA 比对、模糊匹配）。", "• 双序列 DP 的三分支转移：删除 / 插入 / 替换，分别对应 dp[i-1][j]、dp[i][j-1]、dp[i-1][j-1]。", "• 初始化的含义：dp[i][0] 和 dp[0][j] 代表「与空串之间的转换」，必须显式赋值。", "• 理解要点：把「对 word1 的操作」重新表述为「两个序列的下标如何一起前移」。", "• 空间优化：dp[i][j] 只依赖上一行和本行左侧，所以可以压缩成一维数组，但要注意保存 dp[i-1][j-", "1]。"]}]}, {"id": 136, "title": "只出现一次的数字", "difficulty": "简单", "category": 17, "page": 184, "sections": [{"title": "题目描述", "paragraphs": ["给你一个非空整数数组 nums，除了某个元素只出现一次以外，其余每个元素均出现两次。找出", "那个只出现了一次的元素。你必须设计并实现线性时间复杂度的算法来解决此问题，且该算法只", "使用常量额外空间。", "示例：", "输入：nums = [4,1,2,1,2]", "输出：4"]}, {"title": "解题思路", "paragraphs": ["最巧妙也最简洁的解法：**异或运算（XOR）**。", "异或的三个关键性质：", "1. a ^ a = 0（相同的数异或得 0）。", "2. a ^ 0 = a（任何数与 0 异或等于自身）。", "3. 异或满足交换律和结合律（顺序不重要）。", "于是把数组里所有数全部异或起来：成对出现的数会互相抵消变成 0，最后剩下的就是那个只出", "现一次的数。", "具体步骤：", "1. ans = 0。", "2. 遍历每个数 x：ans ^= x。", "3. 返回 ans。", "其他解法（供对比）：哈希表统计（O(n) 空间，不满足空间要求）；排序后相邻比较（O(n log", "n) 时间，不满足时间要求）。只有异或同时满足两个要求。"]}, {"title": "参考代码", "code": "def singleNumber(nums):\n    ans = 0\n    for x in nums:\n        ans ^= x          # 成对的数会互相抵消为 0\n    return ans\n\n# 一行写法\nfrom functools import reduce\ndef singleNumber2(nums):\n    return reduce(lambda a, b: a ^ b, nums, 0)"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n)：一次遍历。空间复杂度 O(1)：只用一个变量。"]}, {"title": "核心知识点", "paragraphs": ["• 异或（XOR）运算：位运算中最常用的「消重」工具，性质 a^a=0、a^0=a 是核心。", "• 交换律与结合律：所以异或的顺序无关，可以一次遍历全部异或。", "• 位运算的价值：在特定约束下可以实现 O(1) 空间的技巧性解法。", "• 读题关键：题目「其余每个元素均出现两次」这个条件，正是为异或解法量身定做的。", "• 衍生题：只出现一次的数字 II（137，其余出现 3 次，需按位统计）／III（260，两个数只出现一", "次，需按位分组）。"]}]}, {"id": 169, "title": "多数元素", "difficulty": "简单", "category": 17, "page": 186, "sections": [{"title": "题目描述", "paragraphs": ["给定一个大小为 n 的数组 nums，返回其中的多数元素。多数元素是指在数组中出现次数大于", "⌊n/2⌋ 的元素。你可以假设数组是非空的，并且给定的数组总是存在多数元素。", "示例：", "输入：nums = [3,2,3]", "输出：3"]}, {"title": "解题思路", "paragraphs": ["方法一（哈希表计数，O(n) 空间，最直观）：统计每个数的出现次数，找到超过 n/2 的那个。", "方法二（排序，O(n log n)）：排序后下标为 n//2 的元素一定是多数元素（因为它出现超过一半，", "必定覆盖数组正中间的位置）。", "方法三（Boyer-Moore 投票算法，O(n) 时间 / O(1) 空间，最优解）：", "核心思想：「多数元素出现次数超过一半，所以它能抵消掉所有其他元素」。", "具体步骤：", "1. candidate = None，count = 0。", "2. 遍历每个数 x：", "- 若 count == 0：说明之前的候选被消耗完了，把 x 作为新候选（candidate = x，count =", "1）。", "- 否则若 x == candidate：count += 1（支持它）。", "- 否则：count -= 1（反对它，抵消一个）。", "3. 遍历结束后，candidate 就是多数元素。", "直观比喻：把每个非多数元素都看作「反对票」，多数元素每张赞成票只能抵消一张反对票，但", "由于它数量过半，最后一定还剩着。"]}, {"title": "参考代码", "code": "# 方法一: 哈希计数\nfrom collections import Counter\n\ndef majorityElement(nums):\n    counts = Counter(nums)\n    return counts.most_common(1)[0][0]\n\n# 方法二: 排序取中位\ndef majorityElement2(nums):\n    nums.sort()\n    return nums[len(nums) // 2]\n\n# 方法三: Boyer-Moore 投票算法 (最优)\ndef majorityElement3(nums):\n    candidate = None\n    count = 0\n    for x in nums:\n        if count == 0:\n            candidate = x          # 换新候选\n            count = 1\n        elif x == candidate:\n            count += 1             # 支持\n        else:\n            count -= 1             # 反对, 消耗一张票\n    return candidate"}, {"title": "复杂度分析", "paragraphs": ["哈希法：时间 O(n)，空间 O(n)。排序法：时间 O(n log n)，空间 O(1)（原地排序）。投票算法：时", "间 O(n)，空间 O(1)。"]}, {"title": "核心知识点", "paragraphs": ["• Boyer-Moore 投票算法：用「互相抵消」的思路在 O(1) 空间找出出现次数超过一半的元素，非", "常巧妙。", "• 多数元素的性质：出现次数 > n/2，所以无法被完全抵消，这是算法的正确性基础。", "• 排序取中位：因为多数元素数量过半，必然占据排序后的中间位置。", "• 注意条件：只有在「保证存在多数元素」时，投票算法的结果才一定正确；否则需要再遍历一次验", "证。", "• Counter.most_common：Python 标准库的计数器工具，业务代码中很实用。"]}]}, {"id": 75, "title": "颜色分类", "difficulty": "中等", "category": 17, "page": 188, "sections": [{"title": "题目描述", "paragraphs": ["给定一个包含红色、白色和蓝色、共 n 个元素的数组 nums，原地对它们进行排序，使得相同颜", "色的元素相邻，并按照红色、白色、蓝色顺序排列。我们使用整数 0、1 和 2 分别表示红色、白", "色和蓝色。必须在不使用库内置的 sort 函数的情况下解决这个问题。", "示例：", "输入：nums = [2,0,2,1,1,0]", "输出：[0,0,1,1,2,2]"]}, {"title": "解题思路", "paragraphs": ["本题是「荷兰国旗问题」（Dutch National Flag Problem），用三指针一次遍历完成。", "三指针的含义：把数组分成三个区域：", "- [0, p0)：全是 0。", "- [p0, i)：全是 1。", "- (p2, n-1]：全是 2。", "- [i, p2]：尚未处理的区域。", "具体步骤：", "1. p0 = 0，i = 0，p2 = n - 1。", "2. 当 i <= p2 时循环，检查 nums[i]：", "- 若为 0：与 nums[p0] 交换，p0 += 1，i += 1。", "- 若为 1：i += 1（已经在正确位置）。", "- 若为 2：与 nums[p2] 交换，p2 -= 1（**注意这里 i 不动**，因为换过来的元素还没检查）。", "最容易出错的地方就是「遇到 2 时 i 不动」：因为从右侧换过来的元素尚未被检查过，需要下一", "轮循环再判断。而遇到 0 时交换过来的元素一定是 1（或自身），所以可以直接 i++。"]}, {"title": "参考代码", "code": "def sortColors(nums):\n    p0 = 0                # 0 区域的右边界(不含)\n    p2 = len(nums) - 1    # 2 区域的左边界(不含)\n    i = 0                 # 当前检查位置\n    while i <= p2:\n        if nums[i] == 0:\n            nums[p0], nums[i] = nums[i], nums[p0]\n            p0 += 1\n            i += 1\n        elif nums[i] == 1:\n            i += 1\n        else:                          # nums[i] == 2\n            nums[i], nums[p2] = nums[p2], nums[i]\n            p2 -= 1                    # i 不移动! 换过来的元素还没检查"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n)：每个元素最多被交换一次、检查一次。空间复杂度 O(1)：原地交换。"]}, {"title": "核心知识点", "paragraphs": ["• 荷兰国旗问题（三路划分）：用三个指针把数组分成「小于 / 等于 / 大于」三段的经典算法。", "• i 不动的原因：从右侧换过来的元素从未被检查，必须重新判断；这是本题最大的坑。", "• 前缀/后缀边界的定义：[0,p0) = 0，(p2, n-1] = 2，中间是 1。", "• 计数排序法（对照）：先数出 0、1、2 的个数再重写数组，需要遍历两趟。", "• 应用延伸：三路划分也是「快速排序处理大量重复元素」时的优化手段。"]}]}, {"id": 31, "title": "下一个排列", "difficulty": "中等", "category": 17, "page": 189, "sections": [{"title": "题目描述", "paragraphs": ["整数数组的一个排列就是将其所有成员以序列或线性顺序排列。例如，arr = [1,2,3]，以下这些都", "可以视作 arr 的排列：[1,2,3]、[1,3,2]、[3,1,2]、[2,3,1]。整数数组的下一个排列是指其整数的下", "一个字典序更大的排列。更正式地，如果数组的所有排列根据其字典顺序从小到大排列在一个容", "器中，那么数组的下一个排列就是在这个有序容器中排在它后面的那个排列。如果不存在下一个", "更大的排列，那么这个数组必须重排为字典序最小的排列（即，其元素按升序排列）。必须原地", "修改，只允许使用额外常数空间。", "示例：", "输入：nums = [1,2,3]", "输出：[1,3,2]", "输入：nums = [3,2,1]", "输出：[1,2,3]"]}, {"title": "解题思路", "paragraphs": ["核心思路：为了让字典序「变大得尽可能少」，应该从右往左找到第一个「可以变大的位置」，", "然后把一个「刚好比它大的数」换上来，最后把后面部分调整为最小（升序）。", "具体步骤（四步）：", "1. **从右向左找第一个下降点 i**：即找满足 nums[i] < nums[i+1] 的最大下标 i。如果不存在", "（整个数组是降序，例如 [3,2,1]），说明已经是最大排列，直接反转整个数组并返回。", "2. **从右向左找第一个大于 nums[i] 的数 j**：由于 i 右侧是降序的，从右往左找第一个大于", "nums[i] 的元素 j，它就是「恰好比 nums[i] 大的最小元素」。", "3. **交换 nums[i] 和 nums[j]**。", "4. **反转 i+1 到末尾的部分**：交换后，i 右侧仍然是降序的，把它反转为升序，就得到了「最小", "的后缀」。", "举例：nums = [1,5,8,4,7,6,5,3,1]", "1. 从右往左找第一个下降点：4 < 7，所以 i 指向 4（下标 3）。", "2. 从右往左找第一个 > 4 的数：5（下标 6）。", "3. 交换后：[1,5,8,5,7,6,4,3,1]。", "4. 反转 i 之后的部分（原为 [7,6,4,3,1]，反转为 [1,3,4,6,7]）。", "结果：[1,5,8,5,1,3,4,6,7]。这就是下一个排列。"]}, {"title": "参考代码", "code": "def nextPermutation(nums):\n    n = len(nums)\n    # 1. 从右向左找第一个下降点 i\n    i = n - 2\n    while i >= 0 and nums[i] >= nums[i + 1]:\n        i -= 1\n    if i >= 0:\n        # 2. 从右向左找第一个大于 nums[i] 的位置 j\n        j = n - 1\n        while nums[j] <= nums[i]:\n            j -= 1\n        # 3. 交换\n        nums[i], nums[j] = nums[j], nums[i]\n    # 4. 反转 i+1 到末尾 (若 i<0 则整个数组反转, 得到最小排列)\n    l, r = i + 1, n - 1\n    while l < r:\n        nums[l], nums[r] = nums[r], nums[l]\n        l += 1\n        r -= 1\n    return nums"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n)：最多三次线性扫描。空间复杂度 O(1)：原地操作。"]}, {"title": "核心知识点", "paragraphs": ["• 字典序的定义与生成算法：理解「下一个排列」的手工推导过程，是掌握本题的关键。", "• 「找下降点」的含义：只要后缀是降序，就说明后缀已是最大排列，必须改前面的位置。", "• 「找恰好更大的数」：因为 i 右侧是降序，从右往左第一个大于 nums[i] 的元素就是「最小的更大", "值」。", "• 最后的反转：把降序后缀变为升序，得到最小的后缀，保证整体是「下一个」而不是「跳过若干", "个」。", "• 「不存在下降点」的处理：整个数组降序时说明已是最后一个排列，反转得到最小排列。", "• 这是 C++ STL 中 std::next_permutation 的实现原理，也是回溯法「按字典序枚举排列」的底层", "工具。"]}]}, {"id": 287, "title": "寻找重复数", "difficulty": "中等", "category": 17, "page": 191, "sections": [{"title": "题目描述", "paragraphs": ["给定一个包含 n + 1 个整数的数组 nums，其数字都在 [1, n] 范围内（包括 1 和 n），可知至少", "存在一个重复的整数。假设 nums 只有一个重复的整数，返回这个重复的数。你设计的解决方案", "必须不修改数组 nums 且只用常量级 O(1) 的额外空间。", "示例：", "输入：nums = [1,3,4,2,2]", "输出：2"]}, {"title": "解题思路", "paragraphs": ["题目限制很严格：不能修改数组、O(1) 空间、比 O(n²) 快。巧妙解法是把它转化为「链表找环入", "口」问题。", "**核心转化**：把数组视为「指针」——下标 i 指向 nums[i]。由于 nums 中的值都在 [1, n] 范", "围内，从下标 0 出发：0 → nums[0] → nums[nums[0]] → …因为存在重复的数，这个「跳跃」", "过程必然会进入一个环，而环的入口正好就是重复的那个数！", "具体步骤（复用「环形链表 II」的解法）：", "1. 用快慢指针找相遇点：slow 每次走 1 步（slow = nums[slow]），fast 每次走 2 步（fast =", "nums[nums[fast]]）。", "2. 相遇后，让 slow 回到起点 0，然后 slow 和 fast 每次都走 1 步，直到再次相遇。", "3. 相遇的位置就是环的入口，也就是重复的数。", "其他解法对比：", "- 二分查找（值域二分）：在 [1,n] 中二分，统计 <= mid 的元素个数，大于 mid 说明重复数在", "左半。O(n log n) / O(1)。", "- 哈希表：O(n) 空间，不满足空间要求。", "- 排序 / 标记负号：修改了数组，不满足要求。"]}, {"title": "参考代码", "code": "def findDuplicate(nums):\n    # 快慢指针找环入口 (等价于环形链表 II)\n    slow = fast = 0\n    while True:\n        slow = nums[slow]                  # 走 1 步\n        fast = nums[nums[fast]]            # 走 2 步\n        if slow == fast:\n            break\n    slow = 0                               # 一个回到起点\n    while slow != fast:\n        slow = nums[slow]\n        fast = nums[fast]\n    return slow                            # 环入口 = 重复的数\n\n# 方法二: 值域二分 (O(n log n) / O(1))\ndef findDuplicate2(nums):\n    lo, hi = 1, len(nums) - 1\n    while lo < hi:\n        mid = (lo + hi) // 2\n        cnt = sum(1 for x in nums if x <= mid)\n        if cnt > mid:          # 左半部分元素过多 -> 重复数在左半\n            hi = mid\n        else:\n            lo = mid + 1\n    return lo"}, {"title": "复杂度分析", "paragraphs": ["快慢指针：时间 O(n)，空间 O(1)。值域二分：时间 O(n log n)，空间 O(1)。"]}, {"title": "核心知识点", "paragraphs": ["• 「数组当链表」的转化：下标 i 指向 nums[i]，把数组问题转化为图/链表问题，是极具创造性的", "思路。", "• 鸽巢原理：n+1 个数放在 [1,n] 范围内，必有重复，这是问题有解的根本保证。", "• Floyd 判圈算法的复用：与「环形链表 II」完全相同的代码，体现了「算法模型迁移」的能力。", "• 值域二分：当「数组索引」和「元素值」范围不同时，可以在「值域」上二分，是一个重要的二分", "变体。", "• 约束驱动解法：「不修改数组 + O(1) 空间」这两个限制，直接排除了排序和哈希，逼出快慢指针", "或值域二分。"]}]}]}</script>

const cat=id=>DATA.categories.find(c=>c.id===id);const problem=id=>DATA.problems.find(p=>p.id===id);
const KEY='leetcode100-reading-v1';let storageOK=true,state={done:[],stars:[],last:null,theme:'light'};
try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&typeof v==='object'){state.done=Array.isArray(v.done)?v.done.filter(id=>problem(id)):[];state.stars=Array.isArray(v.stars)?v.stars.filter(id=>problem(id)):[];state.last=problem(v.last)?v.last:null;state.theme=v.theme==='dark'?'dark':'light';}}catch(e){storageOK=false;}

 document.getElementById('sidebar').innerHTML=`<a class="brand" href="#/catalog"><span class="brand-icon">${icon('code')}</span><span><span class="brand-name">算法手册</span><span class="brand-sub" style="display:block">LEETCODE · HOT 100</span></span></a><a class="nav-home ${currentRoute.type==='catalog'?'active':''}" href="#/catalog" ${currentRoute.type==='catalog'?'aria-current="page"':''}>${icon('grid')}<span>全部题目</span><span class="chapter-count">100</span></a><div class="nav-label">EXPLORE / 算法分类</div><nav class="chapters">${DATA.categories.map(c=>`<a class="chapter-link ${active===c.id?'active':''}" ${active===c.id?'aria-current="page"':''} href="#/category/${c.id}"><span class="chapter-num">${String(c.id).padStart(2,'0')}</span><span>${esc(c.name)}</span><span class="chapter-count">${DATA.problems.filter(p=>p.category===c.id).length}</span></a>`).join('')}</nav><div class="side-bottom"><div class="progress-label"><span>我的学习进度</span><b>${state.done.length} / 100</b></div><div class="progress-track" role="progressbar" aria-label="学习进度" aria-valuenow="${state.done.length}" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" style="width:${state.done.length}%"></div></div>${ps.due?`<a class="side-due" href="#/catalog" data-action="goto-review">${icon('clock')}<span>${ps.due} 题待复习</span></a>`:''}<div class="local-note">${storageOK?'学习记录自动保存在当前浏览器':'浏览器未允许保存，记录仅本次有效'}</div></div>`;
}

function joinParagraphs(paragraphs){let result=[];for(const p of paragraphs){if(result.length&&!/^(?:•|\d+\.|输入|输出|解释|示例|方法|注意|思路|关键|具体|为什么|时间|空间|核心|本质|定义|转移|含义|直观|进阶|拓展)/.test(p)&&!/[。！？：:；;）)]$/.test(result[result.length-1])&&result[result.length-1].length>35){let a=result[result.length-1];result[result.length-1]+=a.slice(-1).match(/[a-zA-Z0-9]/)&&p[0]?.match(/[a-zA-Z0-9]/)?' '+p:p;}else result.push(p);}return result;}
function prose(paragraphs){const ps=joinParagraphs(paragraphs);let out='',list=null,example=false;const closeList=()=>{if(list){out+=`</${list}>`;list=null;}};for(let text of ps){if(/^示例[：:]/.test(text)){closeList();if(example)out+='</div>';out+='<div class="example"><b>EXAMPLE / 示例</b>';example=true;text=text.replace(/^示例[：:]\s*/,'');if(!text)continue;}
 const m=/^(•|\d+\.)\s*(.*)$/.exec(text);if(m){if(example){out+='</div>';example=false;}const type=m[1]==='•'?'ul':'ol';if(list!==type){closeList();out+=`<${type}${type==='ol'?' start="'+parseInt(m[1])+'"':''}>`;list=type;}out+=`<li>${esc(m[2])}</li>`;}else{closeList();out+=`<p>${esc(text)}</p>`;}}
 closeList();if(example)out+='</div>';return out;
}
function highlight(line){const re=/(#[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b(?:def|class|return|if|elif|else|for|while|in|not|and|or|is|None|True|False|from|import|as|with|lambda|yield|break|continue|pass|try|except|finally|raise|nonlocal|global|del|assert)\b|\b\d+(?:\.\d+)?\b|\b[A-Za-z_]\w*(?=\())/g;let result='',pos=0;for(const m of line.matchAll(re)){result+=esc(line.slice(pos,m.index));const t=m[0],type=t.startsWith('#')?'comment':/^['"]/.test(t)?'string':/^\d/.test(t)?'number':/^(def|class|return|if|elif|else|for|while|in|not|and|or|is|None|True|False|from|import|as|with|lambda|yield|break|continue|pass|try|except|finally|raise|nonlocal|global|del|assert)$/.test(t)?'keyword':'function';result+=`<span class="tok-${type}">${esc(t)}</span>`;pos=m.index+t.length;}return result+esc(line.slice(pos));}

let practice={v:1,proficiency:{},history:{}};
let editingRecordId=null,pendingDeleteId=null,pendingDeleteTimer=null;
let recordDraftOpen=false,recordDraftDate='',recordDraftGrade='',recordDraftNote='';

function newRecordId(t){return 'r'+t.toString(36)+Math.random().toString(36).slice(2,6);}
function loadPractice(){
  let raw=null;
  try{raw=JSON.parse(localStorage.getItem(PKEY)||'null');}catch(e){storageOK=false;}
  if(!raw||typeof raw!=='object'||Array.isArray(raw))return;
  const prof=raw.proficiency||{},hist=raw.history||{};
  for(const k in prof){const id=Number(k);if(problem(id)&&GRADE_KEYS.includes(prof[k]))practice.proficiency[id]=prof[k];}
  for(const k in hist){
    const id=Number(k);if(!problem(id))continue;
    const src=Array.isArray(hist[k])?hist[k]:[],clean=[];
    for(const r of src){
      if(!r||typeof r.t!=='number'||!isFinite(r.t))continue;
      clean.push({i:typeof r.i==='string'&&r.i?r.i:newRecordId(r.t),t:r.t,g:GRADE_KEYS.includes(r.g)?r.g:null,n:typeof r.n==='string'?r.n.slice(0,200):'',approx:!!r.approx});
    }
    if(clean.length){clean.sort((a,b)=>b.t-a.t);practice.history[id]=clean;}
  }
}
function savePractice(){try{localStorage.setItem(PKEY,JSON.stringify(practice));}catch(e){storageOK=false;}}

function pad2(n){return String(n).padStart(2,'0');}
function dayStart(v){const d=new Date(v);d.setHours(0,0,0,0);return d;}
function todayStr(v){const d=v?new Date(v):new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function fmtDate(d){return (d.getFullYear()===new Date().getFullYear()?'':d.getFullYear()+'-')+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function fmtWhen(r){const d=new Date(r.t),sameY=d.getFullYear()===new Date().getFullYear(),base=todayStr(d).slice(sameY?5:0);return r.approx?base:base+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());}

function gradeOf(id){return practice.proficiency[id]||null;}
function gradeName(g){return g?GRADE_DEF[g].full:'未评估';}
function recordsOf(id){return practice.history[id]||[];}
function lastRecordOf(id){const r=recordsOf(id);return r.length?r[0]:null;}

function reviewOf(id){
  const g=gradeOf(id),rec=lastRecordOf(id);
  if(!g)return{status:'none',due:null,left:null,overdue:0};
  if(!rec)return{status:'norecord',due:null,left:null,overdue:0};
  const days=GRADE_DEF[g].days;
  if(days===null)return{status:'hold',due:null,left:null,overdue:0};
  const due=dayStart(rec.t);due.setDate(due.getDate()+days);
  const left=Math.round((due-dayStart(new Date()))/86400000);
  if(left<=0)return{status:'due',due,left,overdue:-left};
  if(left===1)return{status:'soon',due,left,overdue:0};
  return{status:'planned',due,left,overdue:0};
}
function reviewText(rv){
  switch(rv.status){
    case 'none':return '设置熟练度后可计算复习时间';
    case 'norecord':return '还没有刷题记录 · 记录首次刷题后开始安排复习';
    case 'hold':return 'A 熟练 · 暂不安排近期复习';
    case 'due':return rv.overdue>0?('待复习 · 已逾期 '+rv.overdue+' 天'):'待复习 · 今天到期';
    case 'soon':return '明天复习 · '+fmtDate(rv.due);
    default:return rv.left+' 天后复习 · '+fmtDate(rv.due);
  }
}

function setGrade(id,g){
  if(g&&GRADE_KEYS.includes(g))practice.proficiency[id]=g;else delete practice.proficiency[id];
  savePractice();
}
function addRecord(id,opt){
  const t=opt.t||Date.now();
  const rec={i:newRecordId(t),t:t,g:opt.g&&GRADE_KEYS.includes(opt.g)?opt.g:null,n:(opt.n||'').trim().slice(0,200),approx:!!opt.approx};
  const arr=recordsOf(id).slice();arr.push(rec);arr.sort((a,b)=>b.t-a.t);
  practice.history[id]=arr;
  if(rec.g)practice.proficiency[id]=rec.g;
  savePractice();return rec;
}
function updateRecord(id,rid,patch){
  const arr=recordsOf(id).map(r=>r.i===rid?Object.assign({},r,patch):r);
  arr.sort((a,b)=>b.t-a.t);practice.history[id]=arr;savePractice();
}
function deleteRecord(id,rid){
  const arr=recordsOf(id).filter(r=>r.i!==rid);
  if(arr.length)practice.history[id]=arr;else delete practice.history[id];
  savePractice();
}

function practiceStats(){
  const prof={A:0,B:0,C:0,D:0,none:0};let total=0,due=0,r7=0,r30=0;
  const t7=dayStart(new Date());t7.setDate(t7.getDate()-6);
  const t30=dayStart(new Date());t30.setDate(t30.getDate()-29);
  const b7=t7.getTime(),b30=t30.getTime();
  for(const p of DATA.problems){
    prof[gradeOf(p.id)||'none']++;
    const rs=recordsOf(p.id);total+=rs.length;
    for(const r of rs){if(r.t>=b7)r7++;if(r.t>=b30)r30++;}
    if(reviewOf(p.id).status==='due')due++;
  }
  return{prof:prof,assessed:100-prof.none,total:total,due:due,r7:r7,r30:r30};
}

function collectExport(){
  return{app:'leetcode-hot100-practice',version:2,exportedAt:new Date().toISOString(),done:state.done,stars:state.stars,last:state.last,theme:state.theme,proficiency:practice.proficiency,history:practice.history};
}
function exportData(){
  try{
    const blob=new Blob([JSON.stringify(collectExport(),null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='leetcode-hot100-学习记录-'+todayStr()+'.json';
    document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast('已导出学习记录 JSON');
  }catch(e){toast('导出失败，请重试');}
}
function importData(text){
  let v=null;try{v=JSON.parse(text);}catch(e){return{ok:false,msg:'文件不是有效的 JSON'};}
  if(!v||typeof v!=='object'||Array.isArray(v))return{ok:false,msg:'文件内容无法识别'};
  let newDone=0,newRec=0;
  if(Array.isArray(v.done)){const s=new Set(state.done);for(const id of v.done){if(problem(id)&&!s.has(id)){s.add(id);newDone++;}}state.done=[...s];}
  if(Array.isArray(v.stars)){const s=new Set(state.stars);for(const id of v.stars)if(problem(id))s.add(id);state.stars=[...s];}
  if(v.proficiency&&typeof v.proficiency==='object'){for(const k in v.proficiency){const id=Number(k);if(problem(id)&&GRADE_KEYS.includes(v.proficiency[k]))practice.proficiency[id]=v.proficiency[k];}}
  if(v.history&&typeof v.history==='object'){
    for(const k in v.history){
      const id=Number(k);if(!problem(id))continue;
      const inc=Array.isArray(v.history[k])?v.history[k]:[];
      const cur=recordsOf(id).slice(),seen=new Set(cur.map(r=>r.i));
      for(const r of inc){
        if(!r||typeof r.t!=='number'||!isFinite(r.t))continue;
        const ri=typeof r.i==='string'&&r.i?r.i:newRecordId(r.t);
        if(seen.has(ri))continue;
        seen.add(ri);
        cur.push({i:ri,t:r.t,g:GRADE_KEYS.includes(r.g)?r.g:null,n:typeof r.n==='string'?r.n.slice(0,200):'',approx:!!r.approx});
        newRec++;
      }
      if(cur.length){cur.sort((a,b)=>b.t-a.t);practice.history[id]=cur;}
    }
  }
  save();savePractice();
  return{ok:true,msg:'导入完成 · 新增 '+newDone+' 条完成记录、'+newRec+' 条刷题记录'};
}

function statusMatch(p){
  const s=filters.status;
  if(s==='todo')return !state.done.includes(p.id);
  if(s==='done')return state.done.includes(p.id);
  if(s==='stars')return state.stars.includes(p.id);
  if(s==='review')return reviewOf(p.id).status==='due';
  return true;
}
function gradeMatch(p){
  const g=filters.grade;
  if(g==='all'||!g)return true;
  if(g==='none')return !gradeOf(p.id);
  return gradeOf(p.id)===g;
}
function gradeChip(id){
  const g=gradeOf(id);
  return g?('<span class="g-tag g-'+g+'" title="熟练度：'+GRADE_DEF[g].full+'">'+g+'</span>'):'';
}
function gradeTag(id){
  const g=gradeOf(id),rv=reviewOf(id);
  const t=g?('<span class="g-tag g-'+g+'" title="'+GRADE_DEF[g].hint+'">'+g+' '+GRADE_DEF[g].full+'</span>'):'<span class="g-tag g-none">未评估</span>';
  return t+(rv.status==='due'?'<span class="review-flag">待复习</span>':'');
}
function gradePickerHtml(id){
  const g=gradeOf(id)||'';
  const items=[['','未评估']].concat(GRADE_KEYS.map(k=>[k,k+' '+GRADE_DEF[k].full]));
  return items.map(function(it){
    const k=it[0],label=it[1];
    return '<button type="button" class="g-'+(k||'none')+(g===k?' on':'')+'" data-action="set-grade" data-grade="'+k+'" aria-pressed="'+(g===k)+'" title="'+(k?GRADE_DEF[k].hint:'还没有进行二刷评估')+'"><i></i>'+label+'</button>';
  }).join('');
}
function manualFormHtml(){
  const opts=['','A','B','C','D'].map(k=>'<option value="'+k+'"'+(recordDraftGrade===k?' selected':'')+'>'+(k?k+' '+GRADE_DEF[k].full:'不评级')+'</option>').join('');
  return '<div class="record-form"><div class="row"><label>日期 <input type="date" id="manualDate" value="'+(recordDraftDate||todayStr())+'" max="'+todayStr()+'"></label><label>评级 <select id="manualGrade">'+opts+'</select></label></div><div class="row"><input type="text" id="manualNote" maxlength="120" placeholder="备注（可选），例如：滑动窗口边界条件处理不熟练" value="'+esc(recordDraftNote)+'"></div><div class="row end"><button type="button" class="btn" data-action="cancel-manual">取消</button><button type="button" class="btn primary" data-action="save-manual">添加记录</button></div></div>';
}
function practicePanelInner(p){
  const g=gradeOf(p.id),rv=reviewOf(p.id),rs=recordsOf(p.id),rec=rs[0];
  const cls=rv.status==='due'?'due':(rv.status==='soon'?'due-soon':'');
  return '<div class="panel-head"><h3 id="practiceTitle">'+icon('target')+'刷题熟练度</h3><span class="panel-sub">'+gradeName(g)+'</span></div>'
   +'<div class="grade-picker" role="group" aria-label="设置熟练度">'+gradePickerHtml(p.id)+'</div>'
   +'<div class="practice-summary"><span>累计刷题 <b>'+rs.length+'</b> 次</span><span>最近刷题 <b>'+(rec?fmtWhen(rec):'—')+'</b></span><span class="'+cls+'">'+reviewText(rv)+'</span></div>'
   +'<div class="practice-actions"><button type="button" class="btn primary" data-action="record-now">'+icon('plus')+'记录一次刷题</button><button type="button" class="btn" data-action="toggle-manual">'+icon('calendar')+'补录历史日期</button></div>'
   +'<div id="manualRecordSlot">'+(recordDraftOpen?manualFormHtml():'')+'</div>';
}
function historyItemHtml(r){
  if(editingRecordId===r.i){
    const opts=['','A','B','C','D'].map(k=>'<option value="'+k+'"'+((r.g||'')===k?' selected':'')+'>'+(k?k+' '+GRADE_DEF[k].full:'不评级')+'</option>').join('');
    return '<div class="history-item editing"><div class="record-form flat">'
     +'<div class="row"><label>日期 <input type="date" id="recDate" value="'+todayStr(r.t)+'" max="'+todayStr()+'"></label><label>评级 <select id="recGrade">'+opts+'</select></label></div>'
     +'<div class="row"><input type="text" id="recNote" maxlength="120" placeholder="备注（可选）" value="'+esc(r.n)+'"></div>'
     +'<div class="row end"><button type="button" class="btn danger" data-action="delete-record" data-rid="'+r.i+'">删除</button><button type="button" class="btn" data-action="cancel-record">取消</button><button type="button" class="btn primary" data-action="save-record" data-rid="'+r.i+'">保存</button></div>'
     +'</div></div>';
  }
  const pending=pendingDeleteId===r.i;
  return '<div class="history-item">'
   +'<span class="history-when">'+fmtWhen(r)+(r.approx?'<i class="approx" title="补录日期">补</i>':'')+'</span>'
   +(r.g?('<span class="g-tag g-'+r.g+'">'+r.g+'</span>'):'<span class="g-tag g-none">—</span>')
   +'<span class="history-note'+(r.n?'':' empty-note')+'">'+(r.n?esc(r.n):'无备注')+'</span>'
   +'<button type="button" class="mini" data-action="edit-record" data-rid="'+r.i+'" aria-label="编辑这条记录">'+icon('edit')+'</button>'
   +'<button type="button" class="mini'+(pending?' danger-confirm':' danger')+'" data-action="'+(pending?'confirm-delete':'delete-record')+'" data-rid="'+r.i+'" aria-label="'+(pending?'确认删除这条记录':'删除这条记录')+'">'+(pending?'确认删除':icon('trash'))+'</button>'
   +'</div>';
}
function historyBlock(p){
  const rs=recordsOf(p.id);
  return '<div class="panel-head"><h3 id="historyTitle">'+icon('clock')+'刷题历史</h3><span class="panel-sub">'+(rs.length?('共 '+rs.length+' 次 · 最近 '+fmtWhen(rs[0])):'暂无记录')+'</span></div>'
   +'<div class="history-list">'+(rs.length?rs.map(historyItemHtml).join(''):'<div class="history-empty">还没有刷题记录。点上面的「记录一次刷题」即可添加，也可以补录以前的日期。</div>')+'</div>';
}
function practicePanel(p){
  return '<section class="panel" id="practicePanel" aria-labelledby="practiceTitle">'+practicePanelInner(p)+'</section><section class="panel" id="historyPanel" aria-labelledby="historyTitle">'+historyBlock(p)+'</section>';
}
function refreshPractice(){
  if(currentRoute.type!=='problem')return;
  const p=problem(currentRoute.id);if(!p)return;
  const a=document.getElementById('practicePanel');if(a)a.innerHTML=practicePanelInner(p);
  const b=document.getElementById('historyPanel');if(b)b.innerHTML=historyBlock(p);
  const c=document.getElementById('readerGrade');if(c)c.innerHTML=gradeTag(p.id);
}
function rerenderAll(){side();if(currentRoute.type==='problem')reader();else catalog();}

function statsPanel(){
  const s=practiceStats();
  const rows=[['none','未评估',s.prof.none]].concat(GRADE_KEYS.map(k=>[k,GRADE_DEF[k].full,s.prof[k]]));
  const dist=rows.map(function(it){
    const k=it[0],label=it[1],n=it[2];
    return '<div class="dist-row"><span class="g-tag g-'+k+'">'+label+'</span><span class="dist-bar"><i class="g-'+k+'" style="width:'+n+'%"></i></span><span class="dist-num">'+n+' 题 · '+n+'%</span></div>';
  }).join('');
  const metrics='<div class="metric"><b>'+s.assessed+'</b><span>已评估题目</span></div>'
   +'<div class="metric'+(s.due?' hot':'')+'"><b>'+s.due+'</b><span>当前待复习</span></div>'
   +'<div class="metric"><b>'+s.total+'</b><span>累计刷题次数</span></div>'
   +'<div class="metric"><b>'+s.r7+'</b><span>最近 7 天</span></div>'
   +'<div class="metric"><b>'+s.r30+'</b><span>最近 30 天</span></div>';
  return '<section class="panel stats-panel" aria-labelledby="statsTitle">'
   +'<div class="panel-head"><h3 id="statsTitle">'+icon('stats')+'学习统计</h3><div class="panel-tools"><button type="button" class="mini" data-action="export-data">'+icon('download')+'导出记录</button><button type="button" class="mini" data-action="import-data">'+icon('upload')+'导入记录</button></div></div>'
   +'<div class="stat-panel"><div class="dist">'+dist+'</div><div class="metric-grid">'+metrics+'</div></div>'
   +'<input type="file" id="importFile" accept=".json,application/json" class="sr-only" tabindex="-1" aria-hidden="true">'
   +'</section>';
}

document.addEventListener('change',function(e){
  const el=e.target;
  if(!el||!el.id)return;
  if(el.id!=='importFile')return;
  const f=el.files&&el.files[0];el.value='';
  if(!f)return;
  if(f.size>8*1024*1024){toast('文件超过 8MB，已取消');return;}
  const fr=new FileReader();
  fr.onload=function(){
    const r=importData(String(fr.result||''));
    if(!r.ok){toast('导入失败：'+r.msg);return;}
    rerenderAll();toast(r.msg);
  };
  fr.onerror=function(){toast('文件读取失败');};
  fr.readAsText(f);
});

loadPractice();
window.addEventListener('hashchange',navigate);applyTheme();navigate();
</script>
