.g-tag{display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:650;border-radius:5px;padding:2px 6px;white-space:nowrap;letter-spacing:.2px;line-height:1.7;flex-shrink:0}
.g-tag.g-none{color:var(--none);background:var(--none-bg)}
.g-tag.g-A{color:var(--green);background:var(--green-bg)}
.g-tag.g-B{color:var(--blue);background:var(--blue-bg)}
.g-tag.g-C{color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.g-tag.g-D{color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent)}
.review-flag{font-size:9px;font-weight:650;color:var(--red);background:color-mix(in srgb,var(--red) 13%,transparent);border-radius:5px;padding:2px 6px;white-space:nowrap;flex-shrink:0}
.g-dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:currentColor;opacity:.85;vertical-align:middle}
.review-dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex-shrink:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 14%,transparent)}

.panel{border:1px solid var(--border);border-radius:13px;background:var(--surface);padding:20px 22px;margin-bottom:22px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px;flex-wrap:wrap}
.panel-head h3{font-size:14px;font-weight:650;margin:0;display:flex;align-items:center;gap:8px;min-width:0}
.panel-head h3 svg{width:16px;height:16px;color:var(--green)}
.panel-sub{font-size:10px;color:var(--muted)}
.panel-tools{display:flex;gap:7px;flex-wrap:wrap}
.mini{display:inline-flex;align-items:center;gap:5px;background:transparent;border:1px solid var(--border);border-radius:6px;font-size:10px;padding:5px 9px;color:var(--muted);min-height:29px;white-space:nowrap}
.mini:hover{color:var(--green);border-color:var(--green)}
.mini svg{width:12px;height:12px}
.mini.danger:hover,.mini.danger-confirm{color:var(--red);border-color:var(--red)}
.mini.danger-confirm{font-weight:650}

.grade-picker{display:flex;flex-wrap:wrap;gap:6px}
.grade-picker button{display:inline-flex;align-items:center;font-size:11px;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);min-height:36px;transition:border-color .15s,background .15s,color .15s}
.grade-picker button:hover{border-color:currentColor}
.grade-picker button i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.45;margin-right:7px;flex-shrink:0}
.grade-picker button.on{font-weight:650}
.grade-picker button.on i{opacity:1}
.grade-picker button.on.g-none{color:var(--none);background:var(--none-bg);border-color:var(--none)}
.grade-picker button.on.g-A{color:var(--green);background:var(--green-bg);border-color:var(--green)}
.grade-picker button.on.g-B{color:var(--blue);background:var(--blue-bg);border-color:var(--blue)}
.grade-picker button.on.g-C{color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent);border-color:var(--gold)}
.grade-picker button.on.g-D{color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent);border-color:var(--red)}

.practice-summary{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:11px;color:var(--muted);margin-top:15px;padding-top:14px;border-top:1px solid var(--border)}
.practice-summary b{color:var(--text);font-weight:650}
.practice-summary .due{color:var(--red);font-weight:650}
.practice-summary .due-soon{color:var(--gold);font-weight:650}
.practice-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}

.record-form{display:flex;flex-direction:column;gap:10px;background:var(--soft);border-radius:10px;padding:14px;margin-top:13px}
.record-form.flat{background:transparent;padding:0;margin:0}
.record-form .row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.record-form .row.end{justify-content:flex-end;gap:7px}
.record-form label{font-size:10px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.record-form input,.record-form select{font-size:11px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:7px 9px;min-height:34px}
.record-form input[type=text]{flex:1;min-width:140px}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,var(--border))}
.btn.danger:hover{background:color-mix(in srgb,var(--red) 9%,transparent);border-color:var(--red)}

.history-list{display:flex;flex-direction:column}
.history-item{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--border);font-size:11px;min-width:0}
.history-item:last-child{border-bottom:0}
.history-when{font-family:ui-monospace,monospace;font-size:10px;color:var(--muted);white-space:nowrap;min-width:100px;display:inline-flex;align-items:center;gap:4px}
.history-when .approx{font-style:normal;font-size:9px;border:1px solid var(--border);border-radius:3px;padding:0 3px;color:var(--muted)}
.history-note{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-note.empty-note{color:var(--muted);font-style:italic}
.history-item .mini{padding:4px 7px;min-height:27px}
.history-item.editing{flex-direction:column;align-items:stretch;gap:10px;background:var(--soft);border-radius:10px;padding:14px;border-bottom:0;margin:4px 0}
.history-empty{font-size:11px;color:var(--muted);padding:6px 0 2px}

.stat-panel{display:grid;grid-template-columns:minmax(230px,1fr) minmax(240px,1.1fr);gap:26px;align-items:start}
.dist{display:flex;flex-direction:column;gap:9px}
.dist-row{display:flex;align-items:center;gap:10px;font-size:11px}
.dist-row .g-tag{min-width:54px}
.dist-bar{flex:1;height:7px;border-radius:4px;background:var(--soft);overflow:hidden;min-width:40px}
.dist-bar i{display:block;height:100%;border-radius:4px;background:var(--none);transition:width .3s}
.dist-bar i.g-A{background:var(--green)}
.dist-bar i.g-B{background:var(--blue)}
.dist-bar i.g-C{background:var(--gold)}
.dist-bar i.g-D{background:var(--red)}
.dist-num{font-family:ui-monospace,monospace;font-size:10px;color:var(--muted);min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:11px}
.metric{border:1px solid var(--border);border-radius:9px;padding:12px 13px}
.metric b{display:block;font-size:20px;font-weight:600;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.35}
.metric span{font-size:10px;color:var(--muted)}
.metric.hot{border-color:color-mix(in srgb,var(--red) 40%,var(--border))}
.metric.hot b{color:var(--red)}

.side-due{display:flex;align-items:center;gap:7px;margin-top:11px;padding:8px 11px;border-radius:8px;font-size:11px;font-weight:600;color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}
.side-due svg{width:14px;height:14px}
.side-due:hover{background:color-mix(in srgb,var(--red) 16%,transparent)}

.filters{flex-wrap:wrap;justify-content:flex-start}
.filters>label:last-child{margin-left:auto}
.grade-tabs{border-left:1px solid var(--border);padding-left:10px;min-width:0}
.filter-tab .g-dot{margin-right:5px;opacity:.5}
.filter-tab.active .g-dot{opacity:1}

/* 移动端：必须放在本块最后，才能覆盖上面的同名前缀基础规则 */
@media(max-width:700px){
.panel{padding:16px 15px;border-radius:11px;margin-bottom:18px}
.panel-head{gap:9px;margin-bottom:13px}
.grade-picker{gap:5px}
.grade-picker button{font-size:10px;padding:7px 9px;min-height:33px}
.grade-picker button i{margin-right:5px}
.practice-summary{gap:5px 14px;font-size:10px;margin-top:13px;padding-top:12px}
.practice-actions{gap:6px}
.practice-actions .btn{padding:9px 12px;font-size:11px}
.history-when{min-width:76px;font-size:9px}
.history-item{gap:6px}
.history-note{font-size:10px}
.history-item .mini{padding:4px 6px}
.stat-panel{grid-template-columns:1fr;gap:17px}
.metric-grid{grid-template-columns:repeat(2,1fr);gap:9px}
.metric{padding:10px 11px}
.metric b{font-size:18px}
.dist-num{min-width:58px}
.grade-tabs{border-left:0;padding-left:0}
.filters{gap:8px 10px;align-items:start}
.filters>label:last-child{margin-left:0}
.record-form .row{gap:8px}
.record-form .row.end{gap:6px}
.record-form .row.end .btn{padding:9px 13px}
}
</style>

<script id="content-data" type="application/json">{"categories": [{"id": 1, "name": "哈希", "intro": "哈希表（Hash Table / 字典）的核心价值是「用空间换时间」：把数据存进去以后，查找某个元素只需要 O(1) 的时间。凡是题目里出现「查找某个值是否存在」「统计出现次数」「判断元素是否重复」这类需求，第一反应就应该是哈希表。Python 里用 dict（键值对）或 set（只存键）来实现。"}, {"id": 2, "name": "双指针", "intro": "双指针不是某种数据结构，而是一种「用两个位置变量同时移动来缩小搜索范围」的解题技巧。常见形态有三种：左右指针从两端向中间靠拢（适合有序数组、盛水问题）、快慢指针同向移动（适合原地删除、去重）、以及滑动窗口（下一章单独讲）。识别信号：数组/字符串、要求原地操作、或者有序性可以利用。"}, {"id": 3, "name": "滑动窗口", "intro": "滑动窗口本质上是「双指针」的一种特殊形态：用一个左边界和一个右边界框住一段连续区间，右指针负责「扩张」窗口，左指针负责「收缩」窗口，整个过程窗口只前进不后退，因此能把 O(n²) 的区间枚举降到 O(n)。识别信号：题目要求「连续的子数组 / 子串」，并且带有「最长、最短、满足某条件」这类字眼。"}, {"id": 4, "name": "子串", "intro": "这一组题目仍然围绕「连续区间」展开，但技巧更进阶：前缀和 + 哈希、单调队列、以及难度最高的最小覆盖子串。它们共同考察「如何用合适的数据结构维护区间信息」。"}, {"id": 5, "name": "普通数组", "intro": "这一组题目考察数组上的经典算法思想：动态规划（最大子数组和）、区间贪心（合并区间）、原地轮转、前缀后缀积、以及利用「下标本身作为哈希」的原地算法。它们都很能体现「观察题目结构、设计巧妙算法」的能力。"}, {"id": 6, "name": "矩阵", "intro": "矩阵题的核心是「二维坐标的遍历规律」。常见套路有三类：一是模拟（螺旋、旋转），关键是找到下标变换公式；二是利用矩阵自身的「行列有序」性质做二分或线性查找；三是原地标记（用矩阵自己的某一行/列当标记位），节省空间。"}, {"id": 7, "name": "链表", "intro": "链表题的通用技巧是「虚拟头结点（dummy node）」和「快慢指针」。dummy 结点可以统一处理「头结点被删除或修改」的边界情况，让代码少写很多 if；快慢指针则常用于找中点、判断环、找倒数第 k 个等场景。链表题一定要在纸上画图，把指针的指向变化一步步画出来再写代码，能避免90% 的空指针错误。这一组是链表题的进阶部分，综合运用了快慢指针、原地反转、哈希映射、分治归并、优先队列，以及「哈希表 + 双向链表」这种经典组合数据结构。做完这一组，链表就算打通了。"}, {"id": 8, "name": "二叉树", "intro": "二叉树题的解法高度模板化，掌握以下三条主线就能覆盖绝大多数题目：1）DFS（深度优先，递归）：前序 / 中序 / 后序，写「递归函数」时想清楚「这个函数要做什么、返回什么」。2）BFS（广度优先，层序遍历）：用队列按层访问，适合求深度、右视图、层内聚合等问题。3）二叉搜索树（BST）：中序遍历结果一定有序，这是 BST 题目的万能钥匙。解题时的思考顺序：先想「用递归还是用队列」，再想「递归函数的返回值代表什么」，最后处理「左右子树的信息如何汇总」。"}, {"id": 9, "name": "图", "intro": "图相关的题目在 Hot 100 中主要集中在「网格搜索」和「拓扑排序」两类。1）网格 DFS/BFS：把二维网格看成图，每个格子是结点，上下左右相邻是边。「岛屿数量」「腐烂的橘子」都是此类，关键是掌握「访问标记」与「方向数组」。2）拓扑排序：处理「有依赖关系的任务排序」，用「入度 + 队列」（Kahn 算法）或 DFS 检测环。3）前缀树（Trie）：字符串集合的高效存储结构，也是「多叉树 + 哈希」的典型设计。"}, {"id": 10, "name": "回溯", "intro": "回溯算法（Backtracking）本质是「带撤销的暴力搜索」：沿着一条路往前走，走不通就退回上一步，换另一条路继续试。通用模板（务必背下来）：def backtrack(路径, 选择列表):if 满足结束条件:记录结果; returnfor 选择 in 选择列表:做选择            # 修改状态backtrack(路径, 新的选择列表)撤销选择          # 恢复状态（这一步就是「回溯」）所有回溯题的区别只在于三个问题：1）什么时候把「路径」加入结果集？（子集问题在进入函数时加、排列问题在叶子处加）2）选择列表是什么？（由题目决定）3）如何避免重复？（用 start 索引、用 used 数组、或排序后跳过同层重复元素）"}, {"id": 11, "name": "二分查找", "intro": "二分查找的前提是「有序」或「具有二段性质」（即可以找到一个分界点，使得一侧全满足条件、另一侧全不满足）。最标准、最不容易写错的模板（左闭右闭区间）：left, right = 0, n - 1while left <= right:mid = (left + right) // 2if 满足条件: return midelif 目标在右侧: left = mid + 1else: right = mid - 1写二分的三个要点：1. 明确「区间含义」（左闭右闭还是左闭右开），并保持一致。2. 循环条件是 left <= right 还是 left < right，取决于区间定义。3. mid 用 (left + right) // 2 可能溢出（在 C++/Java 中），Python 无此问题，但可用 left +(right-left)//2 更规范。"}, {"id": 12, "name": "栈", "intro": "栈（Stack）是「后进先出」（LIFO）的线性结构，Python 里直接用 list 实现（append / pop 均为O(1)）。栈的三大典型应用场景：1）括号匹配、表达式求值：遇到「左」压栈，遇到「右」弹栈配对。2）单调栈：维护一个单调递增/递减的栈，用于求「下一个更大/更小元素」。3）辅助栈：用一个额外的栈保存「当前状态下的最值 / 额外信息」，如最小栈。判断某题是否该用栈：如果问题的结构是「嵌套的」「需要与最近的未匹配元素配对」，就该考虑栈。"}, {"id": 13, "name": "堆（优先队列）", "intro": "堆（Heap）是一种「能快速取到最值」的完全二叉树结构。Python 的 heapq 提供的是小顶堆：heapq.heappush(h, x)   # 入堆, O(log n)heapq.heappop(h)       # 弹出最小元素, O(log n)h[0]                   # 查看最小元素, O(1)要当大顶堆用，可以存负数（取出来再取反）。堆的典型场景：Top K 问题（第 K 大、前 K 个高频）、多路归并、数据流中位数、任务调度。Top K 的核心技巧：维护一个大小为 K 的堆，把复杂度从「全排序 O(n log n)」降到 O(n log k)。"}, {"id": 14, "name": "贪心算法", "intro": "贪心算法（Greedy）的核心是「每一步都做当前看起来最优的选择，并且相信这样能得到全局最优」。贪心和动态规划的区别：- 动态规划会考虑所有可能的选择并在其中取最优（有「状态转移方程」）。- 贪心只做一个选择（局部最优），不做回退。关键：**贪心不是万能的**，只有能证明「局部最优可以推出全局最优」时才能用。面试时如果想到贪心，最好能简单说明「为什么这样做不会错过最优解」。常见的贪心套路：按某个关键字排序后依次处理、维护当前能到达的最远位置、边界的动态扩展。"}, {"id": 15, "name": "动态规划", "intro": "动态规划（Dynamic Programming, DP）是算法面试中最重要的思想之一。它的核心是「把大问题拆成重叠的子问题，并把子问题的答案记下来避免重复计算」。做 DP 的四个步骤（强烈建议按顺序思考）：1. **定义状态**：dp[i] 或 dp[i][j] 到底表示什么？（这是最关键、也最难的一步）2. **写状态转移方程**：dp[i] 可以由哪些「更小的状态」推出来？3. **确定初始条件与边界**：dp[0]、dp[1] 是多少？数组下标有没有越界？4. **确定遍历顺序**：保证「用到的小状态」都已经算好了。常见题型分类：- 线性 DP：爬楼梯、打家劫舍、最长递增子序列- 背包 DP：0-1 背包（分割等和子集）、完全背包（零钱兑换、完全平方数）- 字符串 DP：单词拆分、最长有效括号- 双状态 DP：乘积最大子数组（同时维护最大值和最小值）"}, {"id": 16, "name": "多维动态规划", "intro": "多维 DP 指的是状态由两个（或多个）维度共同决定，典型形式是 dp[i][j]。常见于：1）网格路径问题：dp[i][j] 表示「到达格子 (i,j) 的最优值」，由「上方」和「左方」推出。2）双序列问题（两个字符串 / 两个数组）：dp[i][j] 表示「第一个序列前 i 个、第二个序列前 j 个」的最优值。这是最难也最重要的一类，最长公共子序列、编辑距离都属于它。解题要点：先想清楚 dp[i][j] 的两个维度各代表什么，再思考「最后一步」如何从 (i-1,j)、(i,j-1)、(i-1,j-1) 转移过来。另外，很多二维 DP 都可以「按行滚动」压缩成一维，从而优化空间。"}, {"id": 17, "name": "技巧", "intro": "这一组题目考察的是「巧妙的观察」——它们往往有不止一种解法，但存在利用题目特殊条件的巧妙解法，能把时间或空间复杂度降到极低。这类题目是最能拉开水平差距的：能写出通用解法是及格，能想到巧妙解法是优秀。核心能力是「观察题目给出的特殊约束」，比如「只有一个数出现一次」「一定存在多数元素」「元素范围是[1,n]」。"}], "problems": [{"id": 1, "title": "两数之和", "difficulty": "简单", "category": 1, "page": 9, "sections": [{"title": "题目描述", "paragraphs": ["给定一个整数数组 nums 和一个整数目标值 target，请你在该数组中找出和为目标值 target 的", "那两个整数，并返回它们的数组下标。你可以假设每种输入只会对应一个答案，且同一个元素在", "答案里不能重复出现。答案可以按任意顺序返回。", "示例：", "输入：nums = [2,7,11,15], target = 9", "输出：[0,1]", "解释：nums[0] + nums[1] = 2 + 7 = 9"]}, {"title": "解题思路", "paragraphs": ["最直观的做法是两层循环枚举所有数对，但时间复杂度是 O(n²)，太慢。", "关键思路：对于当前遍历到的数字 x，我们其实需要的不是「另一个数字在哪里」，而是「target", "- x 在不在数组里、它的下标是多少」。这正是哈希表最擅长的：O(1) 判断某个值是否存在。", "具体步骤：", "1. 建一个空字典 seen，用来记录「已经遍历过的数字 → 它的下标」。", "2. 从左到右遍历数组，设当前数字为 x。", "3. 先算它需要的搭档 need = target - x，检查 need 是否已经在 seen 里。", "4. 如果在，说明前面出现过这个搭档，直接返回 [seen[need], 当前下标]。", "5. 如果不在，就把当前的 x 和它的下标存进 seen，继续往后走。", "注意顺序：先查再存。这样能保证不会把自己和自己配对（因为存进去的时候还没查过自己）。"]}, {"title": "参考代码", "code": "def twoSum(nums, target):\n    seen = {}                      # 记录 {数值: 下标}\n    for i, x in enumerate(nums):\n        need = target - x          # 我需要的搭档\n        if need in seen:           # 搭档之前出现过吗?\n            return [seen[need], i]\n        seen[x] = i                # 没找到就把自己存进去\n    return []                      # 题目保证有解，走不到这里"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n)：只需遍历一次数组，每次哈希查找都是 O(1)。空间复杂度 O(n)：最坏情况下要把", "n 个数都存进字典。"]}, {"title": "核心知识点", "paragraphs": ["• 哈希表：以 O(1) 的平均代价完成「查找元素是否存在」，这是本题提速的根本。", "• 空间换时间：多用一个字典，把 O(n²) 的双层循环降到 O(n) 的单层循环。", "• 先查后存：这个顺序保证了不会重复使用同一个元素。", "• 返回值是「下标」而不是「数值」，所以字典要存 值→下标 的映射。"]}]}, {"id": 49, "title": "字母异位词分组", "difficulty": "中等", "category": 1, "page": 10, "sections": [{"title": "题目描述", "paragraphs": ["给你一个字符串数组，请你将「字母异位词」组合在一起。字母异位词指由相同字母重新排列形", "成的字符串（例如 \"ate\" 和 \"tea\"）。可以按任意顺序返回结果列表。", "示例：", "输入：strs = [\"eat\",\"tea\",\"tan\",\"ate\",\"nat\",\"bat\"]", "输出：[[\"bat\"],[\"nat\",\"tan\"],[\"ate\",\"eat\",\"tea\"]]"]}, {"title": "解题思路", "paragraphs": ["题目的难点在于：怎么判断两个单词是「同一组」？字母异位词的共同特征是——它们包含的字", "母种类和数量完全一样。", "两种常用的「统一表示法」：", "方法一（排序）：把单词的字母排序，异位词排序后结果一定相同。例如 eat/tea/ate 排序后都", "是 \"aet\"。", "方法二（计数）：统计 26 个字母各出现多少次，拼成一个长度 26 的计数串作为键。", "具体步骤（用排序法）：", "1. 建立一个字典 groups，键是「归一化后的字符串」，值是「属于这一组的原单词列表」。", "2. 遍历每个单词 word，把它排序得到 key = ''.join(sorted(word))。", "3. 把 word 追加到 groups[key] 里（这一组不存在就自动新建）。", "4. 最后返回 groups 的所有值。", "本质是把「判断两个单词是否同组」这个难题，转化成「它们有没有同一个键」这个简单问题，", "而字典正好按这个键来分组。"]}, {"title": "参考代码", "code": "from collections import defaultdict\n\ndef groupAnagrams(strs):\n    groups = defaultdict(list)          # 键: 归一化串, 值: 同组单词列表\n    for word in strs:\n        key = ''.join(sorted(word))     # ['a','e','t'] -> 'aet'\n        groups[key].append(word)\n    return list(groups.values())\n\n# 方法二：计数作为键（当单词很长时更快，省掉排序）\ndef groupAnagrams2(strs):\n    groups = defaultdict(list)\n    for word in strs:\n        cnt = [0] * 26\n        for ch in word:\n            cnt[ord(ch) - ord('a')] += 1\n        key = tuple(cnt)                # 长度 26 的元组作为哈希键\n        groups[key].append(word)\n    return list(groups.values())"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n·k log k)，n 是单词个数，k 是最长单词长度（排序开销）。若改用计数法则是 O(n·k)。", "空间复杂度 O(n·k)，用于存储所有单词。"]}, {"title": "核心知识点", "paragraphs": ["• 哈希分组：字典的「键」用来表达类别，同一个键就自动归到一组，这是极其常用的套路。", "• 归一化思想：把形式不同但本质相同的东西，转换成同一个标准表示（排序后 / 计数向量），再拿", "去做比较或作为键。", "• defaultdict(list)：Python 里做分组统计的标准写法，省去「键不存在要先建空列表」的判断。", "• 元组可哈希：列表不能作为字典的键，但 tuple 可以，所以计数法里要转成 tuple。"]}]}, {"id": 128, "title": "最长连续序列", "difficulty": "中等", "category": 1, "page": 12, "sections": [{"title": "题目描述", "paragraphs": ["给定一个未排序的整数数组 nums，找出数字连续的最长序列（不要求序列元素在原数组中连续）", "的长度。请你设计并实现时间复杂度为 O(n) 的算法解决此问题。", "示例：", "输入：nums = [100,4,200,1,3,2]", "输出：4", "解释：最长连续序列是 [1,2,3,4]，长度为 4。"]}, {"title": "解题思路", "paragraphs": ["如果先排序再扫一遍，需要 O(n log n)，不满足要求。要求 O(n)，就要利用哈希集合的去重和", "O(1) 查找。", "核心观察：一个连续序列一定有个起点，而「起点」的判定标准是——它的前一个数 x-1 不在集", "合里。否则它就不是起点，可以从别的数往后数到它。", "具体步骤：", "1. 把所有数字放进集合 S（自动去重，同时支持 O(1) 判断某数是否存在）。", "2. 遍历集合中的每个数 x，先判断 x-1 是否在 S 中。如果在，说明 x 不是序列起点，直接跳过。", "3. 如果 x-1 不在，说明 x 是某段连续序列的起点，就从 x 开始不断尝试 x+1、x+2……直到断掉，", "统计长度。", "4. 用全局变量记录最大长度。", "为什么这样是 O(n)？因为每个数字最多只会被「作为序列内部元素」访问一次（只有起点会触发", "往后的扫描），总访问次数是 O(n)。"]}, {"title": "参考代码", "code": "def longestConsecutive(nums):\n    s = set(nums)\n    best = 0\n    for x in s:\n        if x - 1 in s:          # 不是起点，跳过，避免重复扫描\n            continue\n        y = x                   # 从起点开始往后数\n        while y + 1 in s:\n            y += 1\n        best = max(best, y - x + 1)\n    return best"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n)：虽然有 while 循环，但每个元素只会被数到一次，总体仍是线性。空间复杂度", "O(n)：集合存储所有元素。"]}, {"title": "核心知识点", "paragraphs": ["• 哈希集合 set：兼有「去重」和「O(1) 查询」两个能力，是处理「元素是否出现过」类问题的利器。", "• 找起点 + 顺延：只在起点处展开扫描，避免了对同一段序列的重复计算——这是把看似 O(n²) 降", "为 O(n) 的关键。", "• 均摊复杂度分析：内层 while 的累计次数不超过 n，所以要按「整体」而不是「单次循环」来估算", "复杂度。", "• 不要求原数组连续，只要求数值连续，因此可以用集合打散原顺序。"]}]}, {"id": 283, "title": "移动零", "difficulty": "简单", "category": 2, "page": 14, "sections": [{"title": "题目描述", "paragraphs": ["给定一个数组 nums，编写一个函数将所有 0 移动到数组的末尾，同时保持非零元素的相对顺序。", "请注意，必须在不复制数组的情况下原地对数组进行操作。", "示例：", "输入：nums = [0,1,0,3,12]", "输出：[1,3,12,0,0]"]}, {"title": "解题思路", "paragraphs": ["「原地 + 保持相对顺序」是快慢指针的典型场景。", "思路：把快指针 fast 当作「读指针」，慢指针 slow 当作「写指针」。fast 一路扫描所有元素，", "只要遇到非零数，就把它写到 slow 的位置，然后 slow 前进一格。这样所有非零数会被依次、按", "原顺序地搬到数组前半部分。", "具体步骤：", "1. slow = 0，表示下一个非零数应该放的位置。", "2. fast 从 0 遍历到 n-1。", "3. 若 nums[fast] != 0，就交换 nums[slow] 和 nums[fast]，然后 slow += 1。", "4. 遍历结束后，[0, slow) 全是非零数（且相对顺序不变），[slow, n) 全是 0。", "为什么用「交换」而不是「赋值」？交换可以一步到位把 0 换到后面，不需要额外的清尾步骤。", "而且当 slow == fast 时交换是空操作，不影响正确性。"]}, {"title": "参考代码", "code": "def moveZeroes(nums):\n    slow = 0                       # 写指针: 下一个非零元素该放的位置\n    for fast in range(len(nums)):  # 读指针: 扫描全部元素\n        if nums[fast] != 0:\n            nums[slow], nums[fast] = nums[fast], nums[slow]\n            slow += 1\n    return nums"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n)：只遍历一次数组。空间复杂度 O(1)：只用了两个下标变量，原地修改。"]}, {"title": "核心知识点", "paragraphs": ["• 快慢指针 / 读写指针：用两个下标区分「扫描位置」和「写入位置」，是原地数组操作的通用范式。", "• 原地算法（in-place）：只用常数级额外空间完成修改，常见于数组、链表题。", "• 保持相对顺序：非零元素按扫描顺序被依次写入，天然有序。", "• Python 的多元赋值可以一行完成交换，底层是先构造元组再解包。"]}]}, {"id": 11, "title": "盛最多水的容器", "difficulty": "中等", "category": 2, "page": 15, "sections": [{"title": "题目描述", "paragraphs": ["给定一个长度为 n 的整数数组 height，第 i 条线的两个端点是 (i, 0) 和 (i, height[i])。找出其中", "的两条线，使得它们与 x 轴共同构成的容器可以容纳最多的水。返回容器可以储存的最大水量。", "示例：", "输入：height = [1,8,6,2,5,4,8,3,7]", "输出：49", "解释：选下标 1（高 8）和下标 8（高 7），宽度 7，高度取较小值 7，面积 = 7×7 = 49。"]}, {"title": "解题思路", "paragraphs": ["容器的水量公式：面积 = 两线的间距（宽）× 两条线中较矮的那条的高度（高）。", "暴力枚举所有线对是 O(n²)。用左右指针从两端向中间收缩，可以做到 O(n)。", "关键推理：一开始左右指针在两端，此时宽度最大。面积由「较矮的那条线」决定。如果移动较", "高的那条线，宽度变小了，而高度上限依然是那条矮线，面积不可能变大。所以只有移动「较矮", "的那条线」，才有可能让高度提升，从而让面积变大。这就是贪心式的收缩依据。", "具体步骤：", "1. left = 0，right = n-1，记录最佳答案 ans = 0。", "2. 当 left < right 时：宽 = right - left，高 = min(height[left], height[right])，更新 ans。", "3. 比较两边高度，把较矮的那一侧指针向内移动一格（相等时移动哪边都可以）。", "4. 重复直到两指针相遇。"]}, {"title": "参考代码", "code": "def maxArea(height):\n    left, right = 0, len(height) - 1\n    ans = 0\n    while left < right:\n        h = min(height[left], height[right])   # 容器高度由矮的一侧决定\n        ans = max(ans, h * (right - left))     # 更新最大面积\n        if height[left] < height[right]:       # 只移动矮的那一侧\n            left += 1\n        else:\n            right -= 1\n    return ans"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n)：左右指针一共移动 n-1 次。空间复杂度 O(1)：只用了常数个变量。"]}, {"title": "核心知识点", "paragraphs": ["• 对撞双指针：从两端向中间收缩，每轮淘汰一个不可能成为答案的位置，把 O(n²) 降为 O(n)。", "• 贪心思想的体现：每一步都做出局部最优选择（移动矮边），并能证明它不会错过全局最优。", "• 面积由短板决定：这是「木桶效应」的直观应用。", "• 正确性证明思路：宽度只会越来越小，所以只有提高「高」才可能更优，而只有移矮边才可能提高", "高。"]}]}, {"id": 15, "title": "三数之和", "difficulty": "中等", "category": 2, "page": 17, "sections": [{"title": "题目描述", "paragraphs": ["给你一个整数数组 nums，判断是否存在三元组 [nums[i], nums[j], nums[k]] 满足 i != j、i != k", "且 j != k，同时还满足 nums[i] + nums[j] + nums[k] == 0。请返回所有和为 0 且不重复的三元", "组。答案中不可以包含重复的三元组。", "示例：", "输入：nums = [-1,0,1,2,-1,-4]", "输出：[[-1,-1,2],[-1,0,1]]"]}, {"title": "解题思路", "paragraphs": ["三个数的暴力枚举是 O(n³)。经典降维思路：先固定一个数，问题就变成「在剩下的数里找两个", "数之和等于目标值」，而这就是两数之和，可以用双指针在 O(n) 内解决。", "具体步骤：", "1. 先把数组排序。排序是双指针能够工作的前提（有序才能靠比较决定移动哪边）。", "2. 枚举第一个数 nums[i]。为了去重，如果 i > 0 且 nums[i] == nums[i-1]，就跳过。", "3. 设 left = i+1，right = n-1，目标值是 -nums[i]。", "4. 计算三数之和 s = nums[i] + nums[left] + nums[right]：", "- 若 s == 0：记录答案；然后 left++、right--，并且跳过左右两侧所有重复值。", "- 若 s < 0：说明总和偏小，需要更大的数，left++。", "- 若 s > 0：说明总和偏大，需要更小的数，right--。", "5. 当 left >= right 时，说明第一个数为 nums[i] 的情况找完了，i 进入下一轮。", "去重是本題的易错点，务必在三处处理：i 的重复、left 的重复、right 的重复。"]}, {"title": "参考代码", "code": "def threeSum(nums):\n    nums.sort()\n    n = len(nums)\n    res = []\n    for i in range(n - 2):\n        if nums[i] > 0:                  # 最小的数已经 > 0，后面不可能有解\n            break\n        if i > 0 and nums[i] == nums[i - 1]:   # 跳过重复的第一个数\n            continue\n        left, right = i + 1, n - 1\n        target = -nums[i]\n        while left < right:\n            s = nums[left] + nums[right]\n            if s == target:\n                res.append([nums[i], nums[left], nums[right]])\n                left += 1\n                right -= 1\n                while left < right and nums[left] == nums[left - 1]:\n                    left += 1                  # 跳过重复的左值\n                while left < right and nums[right] == nums[right + 1]:\n                    right -= 1                 # 跳过重复的右值\n            elif s < target:\n                left += 1                      # 总和太小，左指针右移\n            else:\n                right -= 1                     # 总和太大，右指针左移\n    return res"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n²)：排序 O(n log n)，外层枚举 n 次，每次双指针 O(n)。空间复杂度 O(1)（不计排", "序与结果数组）。"]}, {"title": "核心知识点", "paragraphs": ["• 降维：把「三数之和」通过「固定一个数」转化为「两数之和」，这是处理 K 数之和的通用思路。", "• 排序 + 双指针：排序带来单调性，单调性让双指针可以「根据比较结果决定移动哪一侧」。", "• 去重三连：外层跳过重复首元素，内层跳过重复的 left/right，保证结果的唯一性。", "• 剪枝：nums[i] > 0 时直接 break，因为最小的数都为正，三数之和不可能为 0。", "• 答案是「数值三元组」而不是下标，所以可以先排序打乱原顺序。"]}]}, {"id": 42, "title": "接雨水", "difficulty": "困难", "category": 2, "page": 19, "sections": [{"title": "题目描述", "paragraphs": ["给定 n 个非负整数表示每个宽度为 1 的柱子的高度图，计算按此排列的柱子，下雨之后能接多少", "雨水。", "示例：", "输入：height = [0,1,0,2,1,0,1,3,2,1,2,1]", "输出：6", "解释：中间凹下去的位置可以存水，总共能接 6 个单位的雨水。"]}, {"title": "解题思路", "paragraphs": ["核心公式：对每个位置 i，它能接的雨水量 = min(左边最高的柱子, 右边最高的柱子) - 自己的高", "度。", "直观理解：一个位置能装多少水，取决于它左右两侧「围栏」里较矮的那一边，水最多只能高到", "那儿，再减去自己占的高度。", "方法一（预处理数组，最易懂）：", "1. 先从前往后扫一遍，得到 leftMax[i] = 位置 i 左边（含自己）的最高柱子。", "2. 再从后往前扫一遍，得到 rightMax[i] = 位置 i 右边（含自己）的最高柱子。", "3. 对每个 i，累加 min(leftMax[i], rightMax[i]) - height[i]（负数则当作 0）。", "方法二（双指针，空间 O(1)）：", "其实我们并不需要同时知道左右两侧的最高值，只需要知道「较矮的那一侧」。用 left、right 两", "个指针从两端靠近，同时维护 leftMax 和 rightMax：", "- 若 leftMax < rightMax：左侧是短板，位置 left 的水量可以被 leftMax 确定，处理 left 后", "left++。", "- 否则：右侧是短板，处理 right 后 right--。", "这样只用两个变量就完成了计算。"]}, {"title": "参考代码", "code": "# 方法一：预处理前后缀最大值，思路最清晰\ndef trap(height):\n    n = len(height)\n    if n == 0:\n        return 0\n    leftMax = [0] * n\n    rightMax = [0] * n\n    leftMax[0] = height[0]\n    for i in range(1, n):\n        leftMax[i] = max(leftMax[i - 1], height[i])\n    rightMax[n - 1] = height[n - 1]\n    for i in range(n - 2, -1, -1):\n        rightMax[i] = max(rightMax[i + 1], height[i])\n    ans = 0\n    for i in range(n):\n        ans += min(leftMax[i], rightMax[i]) - height[i]\n    return ans\n\n# 方法二：双指针，空间 O(1)\ndef trap2(height):\n    left, right = 0, len(height) - 1\n    leftMax = rightMax = 0\n    ans = 0\n    while left < right:\n        leftMax = max(leftMax, height[left])\n        rightMax = max(rightMax, height[right])\n        if leftMax < rightMax:      # 左侧是短板，left 位置的水位已确定\n            ans += leftMax - height[left]\n            left += 1\n        else:\n            ans += rightMax - height[right]\n            right -= 1\n    return ans"}, {"title": "复杂度分析", "paragraphs": ["方法一：时间 O(n)，空间 O(n)（两个辅助数组）。方法二：时间 O(n)，空间 O(1)。"]}, {"title": "核心知识点", "paragraphs": ["• 逐位置贡献法：把「整体存水量」拆解成「每个位置存水量之和」，这是很多数组难题的破题方式。", "• 前后缀最值预处理：先正扫一遍、再倒扫一遍，得到每个位置左右两侧的极值，是极其常见的手段。", "• 短板效应：水位由左右两侧较矮的围栏决定。", "• 双指针优化空间：当一侧的短板已经确定时，另一个方向的信息就不再需要，于是可以用双指针边", "算边丢。", "• 单调栈也能解此题（按行计算横向水槽），可作为进阶拓展。"]}]}, {"id": 3, "title": "无重复字符的最长子串", "difficulty": "中等", "category": 3, "page": 21, "sections": [{"title": "题目描述", "paragraphs": ["给定一个字符串 s，请你找出其中不含有重复字符的最长子串的长度。注意是「子串」，必须连续。", "示例：", "输入：s = \"abcabcbb\"", "输出：3", "解释：最长无重复子串是 \"abc\"，长度为 3。"]}, {"title": "解题思路", "paragraphs": ["暴力做法是枚举所有子串并检查是否重复，O(n³) 太慢。用滑动窗口可以做到 O(n)。", "窗口的定义：始终保持窗口 [left, right] 内的字符「互不相同」。", "右指针不断向右扩张，把新字符纳入窗口；如果这个字符和窗口内某个字符重复了，就把左指针", "移动到「重复字符的下一格」，让窗口重新变得无重复。", "具体步骤：", "1. 用一个字典 last 记录「每个字符最后一次出现的下标」。", "2. right 从 0 遍历到末尾。若 s[right] 之前出现过，且它的下标 >= left，说明它在当前窗口内，", "把 left 更新为「该下标 + 1」。", "3. 更新 last[s[right]] = right。", "4. 此时窗口 [left, right] 一定无重复，用 right - left + 1 更新答案。", "易错点：判断条件一定要带「>= left」，否则会用到已经滑出窗口的历史字符，导致 left 错误地", "回退。"]}, {"title": "参考代码", "code": "def lengthOfLongestSubstring(s):\n    last = {}                # 字符 -> 最后一次出现的下标\n    left = 0                 # 窗口左边界\n    ans = 0\n    for right, ch in enumerate(s):\n        if ch in last and last[ch] >= left:   # 该字符在当前窗口内出现过\n            left = last[ch] + 1               # 左边界跳到重复字符的下一位\n        last[ch] = right\n        ans = max(ans, right - left + 1)      # 更新最长长度\n    return ans"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n)：左右指针各自最多走 n 步。空间复杂度 O(min(n, 字符集大小))，字典最多存所有", "不同字符。"]}, {"title": "核心知识点", "paragraphs": ["• 滑动窗口：用两个边界框住连续区间，右扩左缩，一次遍历解决区间问题。", "• 哈希记录位置：字典存「字符→最后下标」，让判断重复和定位都能 O(1) 完成。", "• 左指针不回退：left 永远只增不减，这是整体复杂度为 O(n) 的根本原因。", "• 子串 vs 子序列：子串必须连续，子序列可以跳过元素，两者解法完全不同。"]}]}, {"id": 438, "title": "找到字符串中所有字母异位词", "difficulty": "中等", "category": 3, "page": 22, "sections": [{"title": "题目描述", "paragraphs": ["给定两个字符串 s 和 p，找到 s 中所有 p 的字母异位词的子串，返回这些子串的起始索引。字母", "异位词指由相同字母重排列形成的字符串，且不考虑字符串中字母的顺序。答案按任意顺序返回。", "示例：", "输入：s = \"cbaebabacd\", p = \"abc\"", "输出：[0,6]", "解释：从 0 开始的 \"cba\" 和从 6 开始的 \"bac\" 都是 \"abc\" 的异位词。"]}, {"title": "解题思路", "paragraphs": ["因为异位词长度一定等于 p 的长度，所以我们要找的是「长度为 len(p) 的窗口，其字符计数和 p", "完全一致」。", "这是长度固定的滑动窗口。", "具体步骤：", "1. 用两个长度为 26 的数组 need 和 win，分别记录 p 的字符计数、当前窗口的字符计数。", "2. 先把 s 的前 len(p) 个字符放进窗口。", "3. 检查 need 与 win 是否相等，相等就记录起始下标 0。", "4. 之后窗口每次整体右移一格：加入新进来的字符 s[i]，同时移除滑出去的字符 s[i - len(p)]。", "5. 每移动一次就比对一次两个计数数组，相等就记录答案。", "关键点：窗口大小固定，所以不需要 while 收缩，每次「进一个、出一个」即可。"]}, {"title": "参考代码", "code": "def findAnagrams(s, p):\n    n, m = len(s), len(p)\n    if n < m:\n        return []\n    need = [0] * 26\n    win = [0] * 26\n    for ch in p:\n        need[ord(ch) - ord('a')] += 1\n    res = []\n    for i in range(n):\n        win[ord(s[i]) - ord('a')] += 1        # 新字符进窗口\n        if i >= m:                            # 窗口长度超过 m，移除最左边\n            win[ord(s[i - m]) - ord('a')] -= 1\n        if win == need:                       # 计数完全一致 -> 是异位词\n            res.append(i - m + 1)\n    return res"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n)：遍历一次 s，每次比对两个长度 26 的数组（常数）。空间复杂度 O(1)：两个固定", "大小的计数数组。"]}, {"title": "核心知识点", "paragraphs": ["• 定长滑动窗口：窗口大小固定时，只需「进一出一」，不必用 while 收缩，代码更简洁。", "• 字符计数数组：用长度 26 的数组代替字典统计字母，比较时可以直接用 == 判断，效率高。", "• 把「是否异位词」转化为「计数数组是否相等」，是字符串比较类问题的常用转化。", "• 下标换算：窗口起点 = 右边界 - 长度 + 1。"]}]}, {"id": 560, "title": "和为 K 的子数组", "difficulty": "中等", "category": 4, "page": 25, "sections": [{"title": "题目描述", "paragraphs": ["给你一个整数数组 nums 和一个整数 k，请你统计并返回该数组中和为 k 的子数组的个数。子数", "组是数组中元素的连续非空序列。", "示例：", "输入：nums = [1,1,1], k = 2", "输出：2", "解释：有两个子数组 [1,1] 的和为 2。"]}, {"title": "解题思路", "paragraphs": ["子数组求和自然想到「前缀和」：pre[i] 表示前 i 个元素的和。那么子数组 nums[j..i] 的和 =", "pre[i+1] - pre[j]。", "题目要求这个差等于 k，也就是 pre[i+1] - k = pre[j]，即「前面出现过多少个前缀和等于 当前前", "缀和 - k」。", "于是可以用哈希表统计每个前缀和出现的次数。", "具体步骤：", "1. 建字典 cnt，初始 cnt[0] = 1（表示「空前缀」出现了一次，用于处理从下标 0 开始的子数", "组）。", "2. 设 cur = 0，ans = 0。", "3. 遍历每个数字 x：cur += x，然后 ans += cnt.get(cur - k, 0)（以当前位置结尾的合法子数组", "数）。", "4. 再令 cnt[cur] += 1（把自己这个前缀和记进去，供后面使用）。", "注意「先查后存」的顺序——如果先存后查，当 k == 0 时会把当前前缀和自己算进去，导致多", "计数。", "同时也要注意字典里要统计「次数」而不是「是否存在」，因为同一个前缀和可能出现多次。"]}, {"title": "参考代码", "code": "def subarraySum(nums, k):\n    cnt = {0: 1}          # 前缀和 -> 出现次数; 0 表示空前缀\n    cur = 0\n    ans = 0\n    for x in nums:\n        cur += x\n        ans += cnt.get(cur - k, 0)   # 前面有多少个前缀和等于 cur-k\n        cnt[cur] = cnt.get(cur, 0) + 1\n    return ans"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n)：一次遍历，哈希操作均为 O(1)。空间复杂度 O(n)：最坏情况下前缀和互不相同。"]}, {"title": "核心知识点", "paragraphs": ["• 前缀和（Prefix Sum）：把「区间和」转化为「两个前缀和的差」，是处理子数组求和问题的第", "一武器。", "• 哈希表统计前缀和出现次数：把「找多少个 j 使 pre[j] = cur - k」变成 O(1) 的字典查询。", "• cnt[0] = 1 的哨兵技巧：用来处理「子数组从下标 0 开始」的情况，非常容易漏。", "• 先查后存：保证不会把当前元素自己当成配对对象。"]}]}, {"id": 239, "title": "滑动窗口最大值", "difficulty": "困难", "category": 4, "page": 26, "sections": [{"title": "题目描述", "paragraphs": ["给你一个整数数组 nums，有一个大小为 k 的滑动窗口从数组的最左侧移动到数组的最右侧。你", "只可以看到在滑动窗口内的 k 个数字。滑动窗口每次只向右移动一位。返回滑动窗口中的最大值。", "示例：", "输入：nums = [1,3,-1,-3,5,3,6,7], k = 3", "输出：[3,3,5,5,6,7]"]}, {"title": "解题思路", "paragraphs": ["暴力做法每次窗口滑动都求一次 max，复杂度 O(nk)。用「单调队列」可以做到 O(n)。", "核心思想：维护一个「下标队列」，队列中对应的数值是单调递减的。为什么可以这样？如果新", "来的数比队尾的数大，那队尾那个数在未来的任何窗口里都不可能成为最大值了（因为新数更大", "且更新），直接把它丢掉。", "具体步骤：", "1. 建一个双端队列 dq，存的是下标；队列内的数值保持从大到小。", "2. 遍历每个下标 i：", "- 先检查队首是否已经滑出窗口（下标 <= i - k），是就弹出。", "- 然后从队尾开始，把所有「数值小于等于 nums[i]」的下标弹出。", "- 把 i 入队。", "- 当 i >= k - 1 时，队首下标对应的值就是当前窗口最大值，记录答案。", "Python 里用 collections.deque 实现双端队列，两端插入删除都是 O(1)。"]}, {"title": "参考代码", "code": "from collections import deque\n\ndef maxSlidingWindow(nums, k):\n    dq = deque()      # 存下标, 对应数值单调递减\n    res = []\n    for i, x in enumerate(nums):\n        # 1. 队首过期(已滑出窗口)则移除\n        if dq and dq[0] <= i - k:\n            dq.popleft()\n        # 2. 队尾比当前值小的全部移除, 保证单调性\n        while dq and nums[dq[-1]] <= x:\n            dq.pop()\n        dq.append(i)\n        # 3. 窗口成形后, 队首就是最大值\n        if i >= k - 1:\n            res.append(nums[dq[0]])\n    return res"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n)：每个下标最多入队一次、出队一次。空间复杂度 O(k)：队列最多存 k 个下标。"]}, {"title": "核心知识点", "paragraphs": ["• 单调队列：队列中元素保持单调（本题递减），队首即当前区间的极值，是解决「滑动窗口极值」", "的标准工具。", "• 及时淘汰无用元素：被更大且更新的元素「压住」的旧元素永远不可能成为最大值，可以放心丢弃。", "• 双端队列 deque：两端都能 O(1) 增删，是单调队列的载体。", "• 存下标而非存值：这样既能比较数值，又能判断是否过期（下标是否出窗口）。", "• 与「单调栈」区分：单调栈解决「下一个更大元素」，单调队列解决「窗口内极值」。"]}]}, {"id": 76, "title": "最小覆盖子串", "difficulty": "困难", "category": 4, "page": 28, "sections": [{"title": "题目描述", "paragraphs": ["给你一个字符串 s、一个字符串 t。返回 s 中涵盖 t 所有字符的最小子串。如果 s 中不存在涵盖 t", "所有字符的子串，则返回空字符串 \"\"。注意：如果 s 中存在这样的子串，我们保证它是唯一的答", "案。", "示例：", "输入：s = \"ADOBECODEBANC\", t = \"ABC\"", "输出：\"BANC\""]}, {"title": "解题思路", "paragraphs": ["这是滑动窗口里最经典、也最难的模板题：求「满足条件的最短窗口」。", "基本框架是「右指针扩张找可行解，左指针收缩找最优解」：", "1. 用字典 need 记录 t 中各字符的需求数量，用字典 win 记录当前窗口中各字符的数量。", "2. 用变量 valid 记录「已经满足需求（窗口内该字符数量 >= 需求数量）的字符种类数」，当", "valid == len(need) 时说明窗口已经覆盖了 t 的所有字符。", "3. right 向右扩张：把 s[right] 加入 win，若某字符数量达到需求，valid++。", "4. 当窗口已覆盖（valid == len(need)）时，进入内层 while，尝试收缩左边界：", "- 先用当前窗口长度更新最优答案。", "- 把 s[left] 移出窗口，若因此导致某字符数量不足，valid--。", "- left++。", "5. 直到窗口不再覆盖，回到外层继续扩张。", "有效性的判断是用「种类数 valid」而不是「逐字符比较」，这是让复杂度降到 O(n) 的关键。"]}, {"title": "参考代码", "code": "from collections import Counter\n\ndef minWindow(s, t):\n    need = Counter(t)          # 目标字符需求\n    win = {}                   # 当前窗口字符计数\n    valid = 0                  # 已满足需求的字符种类数\n    left = 0\n    start, min_len = 0, float('inf')\n\n    for right, ch in enumerate(s):\n        # 右指针扩张\n        if ch in need:\n            win[ch] = win.get(ch, 0) + 1\n            if win[ch] == need[ch]:\n                valid += 1\n        # 窗口已覆盖 t, 尝试收缩左边界\n        while valid == len(need):\n            if right - left + 1 < min_len:      # 更新最优解\n                start, min_len = left, right - left + 1\n            lc = s[left]\n            if lc in need:\n                if win[lc] == need[lc]:\n                    valid -= 1                  # 收缩后不再满足\n                win[lc] -= 1\n            left += 1\n    return s[start:start + min_len] if min_len != float('inf') else \"\""}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n + m)：n 为 s 长度，m 为 t 长度，每个字符最多进窗口一次、出窗口一次。空间复", "杂度 O(m)：字典最多存 t 中不同字符。"]}, {"title": "核心知识点", "paragraphs": ["• 滑动窗口通用模板：外层扩张、内层收缩，可同时求「最长子串」（内层不收缩时）和「最短子串」", "（内层尽量收缩）。", "• valid 计数法：把「窗口是否满足要求」压缩为一个整数比较，避免每轮都对整个字典做检查。", "• Counter 计数器：Python 标准库自带的字符统计工具，比手写循环更简洁。", "• float('inf') 作为「无解哨兵」，最后统一判断是否找到过合法窗口。", "• 覆盖类问题的判定条件：需求的每个字符在窗口内的数量都 >= 需求量。"]}]}, {"id": 53, "title": "最大子数组和", "difficulty": "中等", "category": 5, "page": 31, "sections": [{"title": "题目描述", "paragraphs": ["给你一个整数数组 nums，请你找出一个具有最大和的连续子数组（子数组最少包含一个元素），", "返回其最大和。子数组是数组中的一个连续部分。", "示例：", "输入：nums = [-2,1,-3,4,-1,2,1,-5,4]", "输出：6", "解释：连续子数组 [4,-1,2,1] 的和最大，为 6。"]}, {"title": "解题思路", "paragraphs": ["这是动态规划的入门经典题（Kadane 算法）。", "定义状态：f[i] 表示「以 nums[i] 结尾」的最大子数组和。注意是「必须以 i 结尾」，这个限定让", "状态转移变得简单。", "转移方程：f[i] = max(nums[i], f[i-1] + nums[i])。", "含义：要么自己单独成一个子数组，要么接在前面结尾的子数组后面。哪个和更大就选哪个。", "直观理解：如果前面那段的和是负数，那它只会拖后腿，不如从自己重新开始。", "具体步骤：", "1. cur = nums[0]，ans = nums[0]。cur 表示「以当前位置结尾的最大和」。", "2. 从下标 1 遍历：cur = max(x, cur + x)。", "3. ans = max(ans, cur)。", "4. 返回 ans。", "由于 f[i] 只依赖 f[i-1]，可以用一个变量滚动更新，空间降到 O(1)。"]}, {"title": "参考代码", "code": "def maxSubArray(nums):\n    cur = ans = nums[0]        # cur: 以当前位置结尾的最大和\n    for x in nums[1:]:\n        cur = max(x, cur + x)  # 前面是负数就重新开始\n        ans = max(ans, cur)\n    return ans\n\n# 附：分治法(O(n log n))版本，作为进阶拓展\ndef maxSubArray2(nums):\n    def solve(l, r):\n        if l == r:\n            return nums[l]\n        mid = (l + r) // 2\n        left_best = solve(l, mid)\n        right_best = solve(mid + 1, r)\n        # 跨越中点的最大和\n        s = 0; lt = float('-inf')\n        for i in range(mid, l - 1, -1):\n            s += nums[i]; lt = max(lt, s)\n        s = 0; rt = float('-inf')\n        for i in range(mid + 1, r + 1):\n            s += nums[i]; rt = max(rt, s)\n        return max(left_best, right_best, lt + rt)\n    return solve(0, len(nums) - 1)"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n)（DP 版本）：一次遍历。空间复杂度 O(1)：只用两个变量滚动。分治版本时间 O(n", "log n)、空间 O(log n)。"]}, {"title": "核心知识点", "paragraphs": ["• 动态规划的状态定义要「带约束」：f[i] 定义为「以 i 结尾」的最大和，才让转移方程变得可写。", "• Kadane 算法：负数前缀果断丢弃，是贪心与 DP 结合的精妙之处。", "• 滚动数组 / 状态压缩：只依赖前一个状态时，用变量代替整个 dp 数组。", "• 分治法（拓展）：最大子数组和 = max(左半最大值, 右半最大值, 跨越中点的最大值)。"]}]}, {"id": 56, "title": "合并区间", "difficulty": "中等", "category": 5, "page": 33, "sections": [{"title": "题目描述", "paragraphs": ["以数组 intervals 表示若干个区间的集合，其中单个区间为 intervals[i] = [starti, endi]。请你合", "并所有重叠的区间，并返回一个不重叠的区间数组，该数组需恰好覆盖输入中的所有区间。", "示例：", "输入：intervals = [[1,3],[2,6],[8,10],[15,18]]", "输出：[[1,6],[8,10],[15,18]]", "解释：[1,3] 和 [2,6] 重叠，合并为 [1,6]。"]}, {"title": "解题思路", "paragraphs": ["区间类问题的第一反应是「先按左端点排序」。排序之后，能合并的区间必然相邻。", "具体步骤：", "1. 把所有区间按左端点从小到大排序。", "2. 结果列表 res 先放入第一个区间。", "3. 依次考察后面的区间 [l, r]：", "- 若 l <= res 中最后一个区间的右端点，说明有重叠或相接，合并：把最后一个区间的右端点", "更新为 max(原右端点, r)。", "- 否则说明不重叠，直接把 [l, r] 追加到 res。", "4. 返回 res。", "注意合并时右端点要取 max，因为有可能新区间完全被包含在旧区间里（例如 [1,10] 与 [2,3]）。", "Python 的 list 可以直接比较，所以对 intervals 排序会默认按第一个元素、再按第二个元素排序。"]}, {"title": "参考代码", "code": "def merge(intervals):\n    intervals.sort()                   # 按左端点排序\n    res = [intervals[0]]\n    for l, r in intervals[1:]:\n        if l <= res[-1][1]:            # 与上一个区间重叠\n            res[-1][1] = max(res[-1][1], r)\n        else:                          # 不重叠, 直接追加\n            res.append([l, r])\n    return res"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n log n)：排序是瓶颈，合并只需一次线性扫描。空间复杂度 O(log n) 或 O(n)：取决", "于排序实现和结果存储。"]}, {"title": "核心知识点", "paragraphs": ["• 区间问题先排序：按左端点排序后，重叠关系就只存在于相邻区间之间，问题大幅简化。", "• 排序的「局部有序性」：利用排序带来的单调性，把全局比较变成相邻比较。", "• 合并时取 max：处理「区间被完全包含」的情况，是常见的易错点。", "• 类比题：插入区间（57）、用最少数量的箭引爆气球（452）、无重叠区间（435）都是同一套思", "路。"]}]}, {"id": 189, "title": "轮转数组", "difficulty": "中等", "category": 5, "page": 34, "sections": [{"title": "题目描述", "paragraphs": ["给定一个整数数组 nums，将数组中的元素向右轮转 k 个位置，其中 k 是非负数。要求尽量想出", "更多的解决方案，至少有三种不同的方法可以解决这个问题，并使用空间复杂度为 O(1) 的原地算", "法。", "示例：", "输入：nums = [1,2,3,4,5,6,7], k = 3", "输出：[5,6,7,1,2,3,4]", "解释：向右轮转 1 步得 [7,1,2,3,4,5,6]，轮转 3 步得 [5,6,7,1,2,3,4]。"]}, {"title": "解题思路", "paragraphs": ["先注意一个细节：如果 k >= n，轮转效果等同于轮转 k % n 步，所以先做 k %= n。", "方法一（切片拼接，最易读，但需要 O(n) 空间）：", "把数组分成后 k 个元素和前 n-k 个元素，重新拼接。", "方法二（三次翻转，空间 O(1)，是本题的标准答案）：", "这是一个很妙的技巧：先把整个数组翻转，再翻转前 k 个元素，最后翻转后 n-k 个元素。", "验证：以 [1,2,3,4,5,6,7]、k=3 为例：", "整体翻转 -> [7,6,5,4,3,2,1]", "翻转前 3 个 -> [5,6,7,4,3,2,1]", "翻转后 4 个 -> [5,6,7,1,2,3,4]  ✓", "直觉理解：整体翻转把「后面的元素」搬到了前面，但也把它们的顺序倒过来了；再分别翻转两", "段，就把两段内部的顺序各自还原。", "具体步骤（三次翻转）：", "1. k %= n。", "2. 翻转区间 [0, n-1]。", "3. 翻转区间 [0, k-1]。", "4. 翻转区间 [k, n-1]。"]}, {"title": "参考代码", "code": "def rotate(nums, k):\n    n = len(nums)\n    k %= n                       # 处理 k > n 的情况\n\n    def reverse(l, r):           # 原地翻转闭区间 [l, r]\n        while l < r:\n            nums[l], nums[r] = nums[r], nums[l]\n            l += 1\n            r -= 1\n\n    reverse(0, n - 1)            # 1. 整体翻转\n    reverse(0, k - 1)            # 2. 翻转前 k 个\n    reverse(k, n - 1)            # 3. 翻转后 n-k 个\n\n# 方法二(简单但费空间)：\ndef rotate2(nums, k):\n    n = len(nums)\n    k %= n\n    nums[:] = nums[n - k:] + nums[:n - k]"}, {"title": "复杂度分析", "paragraphs": ["三次翻转法：时间复杂度 O(n)，每个元素被翻转两次；空间复杂度 O(1)。切片法：时间 O(n)，空间", "O(n)。"]}, {"title": "核心知识点", "paragraphs": ["• 三次翻转技巧：用「反转 + 反转 + 反转」实现循环移位，是原地算法的经典构造。", "• k %= n 取模处理：把「多轮无效轮转」归一化到有效范围内。", "• nums[:] = ... 与 nums = ... 的区别：前者是原地修改（外部引用可见），后者只是重新绑定局部", "变量名。", "• 环状替换法（拓展）：每个元素直接跳到目标位置，用计数控制避免死循环，也能达到 O(1) 空间。"]}]}, {"id": 238, "title": "除自身以外数组的乘积", "difficulty": "中等", "category": 5, "page": 36, "sections": [{"title": "题目描述", "paragraphs": ["给你一个整数数组 nums，返回数组 answer，其中 answer[i] 等于 nums 中除 nums[i] 之外其", "余各元素的乘积。题目数据保证数组 nums 之中任意元素的全部前缀元素和后缀的乘积都在 32", "位整数范围内。请不要使用除法，且在 O(n) 时间复杂度内完成此题。", "示例：", "输入：nums = [1,2,3,4]", "输出：[24,12,8,6]", "解释：answer[0] = 2×3×4 = 24，answer[1] = 1×3×4 = 12，依此类推。"]}, {"title": "解题思路", "paragraphs": ["因为不能用除法，所以不能「先算总乘积再除以自己」（而且元素可能为 0，除法也不安全）。", "关键观察：answer[i] = （i 左侧所有数的乘积）×（i 右侧所有数的乘积）。", "于是我们可以分别计算「左侧前缀积」和「右侧后缀积」，再相乘。", "具体步骤：", "1. 建结果数组 res，长度与 nums 相同。", "2. 第一趟从左往右：用变量 pre 记录「到 i 为止左边所有元素的乘积」，先令 res[i] = pre，再让", "pre *= nums[i]。这一步做完，res[i] 存的就是左侧乘积。", "3. 第二趟从右往左：用变量 suf 记录「到 i 为止右边所有元素的乘积」，令 res[i] *= suf，再让", "suf *= nums[i]。", "4. 返回 res。", "这样只用结果数组本身作为存储，不需要额外的两个数组，空间复杂度降到 O(1)（不计输出数", "组）。"]}, {"title": "参考代码", "code": "def productExceptSelf(nums):\n    n = len(nums)\n    res = [1] * n\n    pre = 1\n    for i in range(n):            # 第一趟: res[i] = 左侧所有元素的乘积\n        res[i] = pre\n        pre *= nums[i]\n    suf = 1\n    for i in range(n - 1, -1, -1):  # 第二趟: 乘上右侧所有元素的乘积\n        res[i] *= suf\n        suf *= nums[i]\n    return res"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n)：两趟线性扫描。空间复杂度 O(1)：除了输出数组外只用两个变量（输出数组通常不", "计入空间复杂度）。"]}, {"title": "核心知识点", "paragraphs": ["• 前缀 / 后缀分解：把「除自己以外的聚合」拆成「左边 × 右边」，是避免除法、避免特殊值判断", "的通用技巧。", "• 两趟扫描：一趟从左往右算前缀，一趟从右往左算后缀，中间用结果数组当缓冲。", "• 空间优化：把中间结果直接写在输出数组上，省掉辅助数组。", "• 不用除法：因为除法的前提是元素非零且无精度损失，而乘积法中 0 会破坏一切。"]}]}, {"id": 41, "title": "缺失的第一个正数", "difficulty": "困难", "category": 5, "page": 38, "sections": [{"title": "题目描述", "paragraphs": ["给你一个未排序的整数数组 nums，请你找出其中没有出现的最小的正整数。请你实现时间复杂", "度为 O(n) 并且只使用常数级别额外空间的解决方案。", "示例：", "输入：nums = [3,4,-1,1]", "输出：2", "解释：数组中包含 1、3、4，缺少 2，所以答案是 2。"]}, {"title": "解题思路", "paragraphs": ["关键观察：长度为 n 的数组中，缺失的最小正整数一定落在 [1, n+1] 范围内。", "因为如果 1 到 n 全都出现了，那答案就是 n+1；否则答案就是 1..n 中第一个没出现的数。", "既然答案的范围是 1..n，我们就可以把「数字 x」放到「下标 x-1」的位置上，让数组自己变成一", "个「哈希表」——下标 i 上有值 i+1，说明 i+1 出现过。", "具体步骤：", "1. 遍历数组，对于每个位置 i，只要满足「nums[i] 在 [1, n] 范围内」且「它还没被换到正确位置", "（即 nums[i] != nums[nums[i]-1]）」，就把它交换到下标 nums[i]-1 处。用 while 反复交换，", "直到当前位置满足条件。", "2. 交换完成后，再从头遍历：第一个满足 nums[i] != i+1 的位置，答案就是 i+1。", "3. 如果全部都满足，说明 1..n 都在，答案是 n+1。", "注意第 1 步的循环条件里用 nums[i] != nums[nums[i]-1] 而不是 nums[i] != i+1，因为要防止", "两个相同的数（如两个 1）之间无限互相交换。"]}, {"title": "参考代码", "code": "def firstMissingPositive(nums):\n    n = len(nums)\n    for i in range(n):\n        # 把值为 x 的数放到下标 x-1 处\n        while 1 <= nums[i] <= n and nums[nums[i] - 1] != nums[i]:\n            j = nums[i] - 1\n            nums[i], nums[j] = nums[j], nums[i]\n    for i in range(n):\n        if nums[i] != i + 1:\n            return i + 1\n    return n + 1"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n)：每个数字最多被交换一次就归位，总交换次数不超过 n。空间复杂度 O(1)：原地交", "换。"]}, {"title": "核心知识点", "paragraphs": ["• 「下标即哈希」的原地哈希思想：当数据范围是 [1, n] 时，用数组下标本身做映射，无需额外空间。", "• 范围推断：先确定答案的取值范围，才能设计出对应的下标映射方案。", "• 交换条件的边界处理：用 nums[nums[i]-1] != nums[i] 避免重复元素造成的死循环。", "• 原地重排 + 二次扫描：第一趟归位，第二趟找出第一个「不在自己位置上」的下标。", "• 同类思想：LeetCode 442、448 等题都用到了原地哈希。"]}]}, {"id": 73, "title": "矩阵置零", "difficulty": "中等", "category": 6, "page": 40, "sections": [{"title": "题目描述", "paragraphs": ["给定一个 m x n 的矩阵，如果一个元素为 0，则将其所在行和列的所有元素都设为 0。请使用原", "地算法。", "示例：", "输入：matrix = [[1,1,1],[1,0,1],[1,1,1]]", "输出：[[1,0,1],[0,0,0],[1,0,1]]"]}, {"title": "解题思路", "paragraphs": ["陷阱在于：如果一边扫描一边置零，新产生的 0 会被误认为是原本就有的 0，导致整片区域被错", "误清零。所以必须「先记录所有该置零的行和列，再统一处理」。", "方法一（最简单，O(m+n) 空间）：用两个集合/数组记录哪些行、哪些列需要置零。", "方法二（O(1) 空间，本题要求的「原地」最优解）：借用矩阵的「第一行」和「第一列」当作标", "记数组。", "具体步骤（方法二）：", "1. 先记录第一行、第一列本身是否需要置零（用两个布尔变量 flagRow0、flagCol0）。", "2. 从 (1,1) 开始扫描整个矩阵：若 matrix[i][j] == 0，就把 matrix[i][0] 和 matrix[0][j] 标记为 0", "（用第一行第一列保存「第 i 行要清零」「第 j 列要清零」的信息）。", "3. 再根据第一行、第一列的标记，把对应行和列置零（注意从 1 开始，不影响标记本身）。", "4. 最后根据 flagRow0 / flagCol0 决定是否清空第一行、第一列。"]}, {"title": "参考代码", "code": "def setZeroes(matrix):\n    m, n = len(matrix), len(matrix[0])\n    flag_row0 = any(matrix[0][j] == 0 for j in range(n))\n    flag_col0 = any(matrix[i][0] == 0 for i in range(m))\n\n    # 用第一行/第一列保存标记\n    for i in range(1, m):\n        for j in range(1, n):\n            if matrix[i][j] == 0:\n                matrix[i][0] = 0\n                matrix[0][j] = 0\n\n    # 依据标记置零 (从 1 开始, 避免破坏标记)\n    for i in range(1, m):\n        for j in range(1, n):\n            if matrix[i][0] == 0 or matrix[0][j] == 0:\n                matrix[i][j] = 0\n\n    # 处理第一行与第一列\n    if flag_row0:\n        for j in range(n):\n            matrix[0][j] = 0\n    if flag_col0:\n        for i in range(m):\n            matrix[i][0] = 0\n    return matrix"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(m×n)：需要遍历矩阵常数次。空间复杂度 O(1)：只用两个布尔变量（方法二）。"]}, {"title": "核心知识点", "paragraphs": ["• 不能边扫描边修改：因为新产生的 0 会污染后续判断，必须「先标记、后执行」。", "• 原地标记技巧：把第一行/第一列「征用」为标记数组，是矩阵题常用的省空间手段。", "• 边界单独处理：被征用的第一行和第一列需要额外变量记录原始状态。", "• any() 生成器：Python 里判断「是否存在满足条件的元素」的简洁写法。"]}]}, {"id": 54, "title": "螺旋矩阵", "difficulty": "中等", "category": 6, "page": 42, "sections": [{"title": "题目描述", "paragraphs": ["给你一个 m 行 n 列的矩阵 matrix，请按照顺时针螺旋顺序，返回矩阵中的所有元素。", "示例：", "输入：matrix = [[1,2,3],[4,5,6],[7,8,9]]", "输出：[1,2,3,6,9,8,7,4,5]"]}, {"title": "解题思路", "paragraphs": ["这是一道纯模拟题，关键在于「用四个边界把已经走过的外圈剥掉」。", "具体步骤：", "1. 定义四个边界：top = 0、bottom = m-1、left = 0、right = n-1。", "2. 循环执行四步，直到边界交叉：", "- 从左到右遍历 top 行，然后 top += 1。", "- 从上到下遍历 right 列，然后 right -= 1。", "- 判断 top <= bottom 后再从右到左遍历 bottom 行，然后 bottom -= 1。", "- 判断 left <= right 后再从下到上遍历 left 列，然后 left += 1。", "3. 每走完一条边就收缩对应边界。", "特别注意第 3、4 步的「边界判断」：当剩余只有一行或一列时，如果不加判断就会重复输出。"]}, {"title": "参考代码", "code": "def spiralOrder(matrix):\n    if not matrix:\n        return []\n    top, bottom = 0, len(matrix) - 1\n    left, right = 0, len(matrix[0]) - 1\n    res = []\n    while top <= bottom and left <= right:\n        for j in range(left, right + 1):        # 上边: 左->右\n            res.append(matrix[top][j])\n        top += 1\n        for i in range(top, bottom + 1):        # 右边: 上->下\n            res.append(matrix[i][right])\n        right -= 1\n        if top <= bottom:                       # 下边: 右->左\n            for j in range(right, left - 1, -1):\n                res.append(matrix[bottom][j])\n            bottom -= 1\n        if left <= right:                       # 左边: 下->上\n            for i in range(bottom, top - 1, -1):\n                res.append(matrix[i][left])\n            left += 1\n    return res"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(m×n)：每个元素访问一次。空间复杂度 O(1)（不计输出数组）：只用四个边界变量。"]}, {"title": "核心知识点", "paragraphs": ["• 边界模拟法：用 top/bottom/left/right 四个变量描述「待遍历区域」，是最不易出错的螺旋遍历", "写法。", "• 收缩顺序：每走完一边就收一格，下一圈自然从内层开始。", "• 特殊情况处理：单行 / 单列时，第 3、4 步必须加边界判断，否则会重复输出。", "• 同类题：螺旋矩阵 II（59）是反过来的构造题；两者可以对照理解。"]}]}, {"id": 48, "title": "旋转图像", "difficulty": "中等", "category": 6, "page": 43, "sections": [{"title": "题目描述", "paragraphs": ["给定一个 n × n 的二维矩阵 matrix 表示一个图像。请你将图像顺时针旋转 90 度。你必须在原地", "旋转图像，这意味着你需要直接修改输入的二维矩阵。请不要使用另一个矩阵来旋转图像。", "示例：", "输入：matrix = [[1,2,3],[4,5,6],[7,8,9]]", "输出：[[7,4,1],[8,5,2],[9,6,3]]"]}, {"title": "解题思路", "paragraphs": ["直接计算旋转后的位置容易绕晕，常用技巧是把它拆成两步基本操作：", "第一步：沿主对角线（左上—右下）翻转（转置）。", "第二步：左右翻转（每一行做逆序）。", "验证：", "原矩阵 [[1,2,3],[4,5,6],[7,8,9]]", "转置后 [[1,4,7],[2,5,8],[3,6,9]]", "每行逆序后 [[7,4,1],[8,5,2],[9,6,3]]  ✓ 正是顺时针旋转 90 度的结果。", "具体步骤：", "1. 双重循环，只处理 j > i 的元素，交换 matrix[i][j] 与 matrix[j][i]（转置）。", "2. 对每一行调用 reverse，或直接 matrix[i].reverse()。", "如果题目要求逆时针旋转 90 度，则改为「沿副对角线翻转 + 左右翻转」。"]}, {"title": "参考代码", "code": "def rotate(matrix):\n    n = len(matrix)\n    # 第一步: 沿主对角线转置 (只处理上三角, 避免重复交换)\n    for i in range(n):\n        for j in range(i + 1, n):\n            matrix[i][j], matrix[j][i] = matrix[j][i], matrix[i][j]\n    # 第二步: 每一行左右翻转\n    for i in range(n):\n        matrix[i].reverse()\n    return matrix"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n²)：每个元素被处理常数次。空间复杂度 O(1)：原地交换，不需要额外矩阵。"]}, {"title": "核心知识点", "paragraphs": ["• 分解复杂操作为基本操作：把「旋转 90 度」拆成「转置 + 行反转」，是化繁为简的典范。", "• 坐标变换公式（拓展）：顺时针旋转时，(i, j) 的新位置是 (j, n-1-i)，也可以直接按四元环交换。", "• 只处理上三角：转置时 j 从 i+1 开始，避免同一对元素被交换两次又还原。", "• 举一反三：逆时针 = 副对角线翻转 + 行反转；180 度 = 上下翻转 + 左右翻转。"]}]}, {"id": 240, "title": "搜索二维矩阵 II", "difficulty": "中等", "category": 6, "page": 45, "sections": [{"title": "题目描述", "paragraphs": ["编写一个高效的算法来搜索 m x n 矩阵 matrix 中的一个目标值 target。该矩阵具有以下特性：", "每行的元素从左到右升序排列；每列的元素从上到下升序排列。", "示例：", "输入：matrix = [[1,4,7,11,15],[2,5,8,12,19],[3,6,9,16,22],[10,13,14,17,24],[18,21,23,26,30]],", "target = 5", "输出：true"]}, {"title": "解题思路", "paragraphs": ["因为行列都有序，可以选取一个「特殊的起点」来逐步缩小范围。", "关键观察：取「右上角」元素作为起点（也可以取左下角）。它有两个很好的性质：", "- 它是所在行的最大值，是所在列的最小值。", "- 于是：若 target < 当前值，说明这一整列都比 target 大，列可以排除（向左移）；", "若 target > 当前值，说明这一整行都比 target 小，行可以排除（向下移）。", "具体步骤：", "1. i = 0（行），j = n-1（列），从右上角开始。", "2. 当 i < m 且 j >= 0 时：", "- 若 matrix[i][j] == target，返回 True。", "- 若 matrix[i][j] > target，j -= 1（排除当前列）。", "- 若 matrix[i][j] < target，i += 1（排除当前行）。", "3. 走出边界说明不存在，返回 False。", "每走一步就排除一整行或一整列，所以最多走 m+n 步。"]}, {"title": "参考代码", "code": "def searchMatrix(matrix, target):\n    if not matrix or not matrix[0]:\n        return False\n    m, n = len(matrix), len(matrix[0])\n    i, j = 0, n - 1            # 从右上角出发\n    while i < m and j >= 0:\n        cur = matrix[i][j]\n        if cur == target:\n            return True\n        elif cur > target:\n            j -= 1             # 当前列整体偏大, 排除该列\n        else:\n            i += 1             # 当前行整体偏小, 排除该行\n    return False"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(m + n)：每步排除一行或一列，最多 m+n 步。空间复杂度 O(1)。"]}, {"title": "核心知识点", "paragraphs": ["• 利用有序性选择「有利的起点」：右上角（或左下角）是同时能对行和列做排除的唯一位置。", "• 线性查找法：把二维搜索问题转化为一条单调路径，比逐行二分（O(m log n)）更快。", "• 行列有序矩阵的三种解法对比：暴力 O(mn)、逐行二分 O(m log n)、右上角法 O(m+n)（最优）。", "• 为什么它等价于二叉搜索树：以右上角为根的 BST，左子树是左边的元素，下侧是下面的元素。"]}]}, {"id": 160, "title": "相交链表", "difficulty": "简单", "category": 7, "page": 47, "sections": [{"title": "题目描述", "paragraphs": ["给你两个单链表的头节点 headA 和 headB，请你找出并返回两个单链表相交的起始节点。如果", "两个链表不存在相交节点，返回 null。题目数据保证整个链式结构中不存在环。函数返回结果后，", "链表必须保持其原始结构。", "示例：", "输入：intersectVal = 8, listA = [4,1,8,4,5], listB = [5,6,1,8,4,5]", "输出：Intersected at '8'"]}, {"title": "解题思路", "paragraphs": ["两条链表相交后是「共同的尾巴」，长度差会导致两个指针无法同时到达交点。", "巧妙的解法（双指针「走对方的路」）：", "1. 指针 p 从 headA 出发，指针 q 从 headB 出发，每次都走一步。", "2. 当 p 走到 null 时，让它从 headB 重新开始；当 q 走到 null 时，让它从 headA 重新开始。", "3. 这样两个指针一共走的路程都是「lenA + lenB」，必然会在同一时刻到达相交点；如果两链表", "不相交，它们会同时到达 null（此时返回 None）。", "直观理解：p 先走完 A 再走 B，q 先走完 B 再走 A，两者步数相同，于是就「对齐」了长度差。", "若存在交点 x，则两指针走的路程都是 (a + b + c) 中的同一段，自然同时到达 x。"]}, {"title": "参考代码", "code": "class ListNode:\n    def __init__(self, x):\n        self.val = x\n        self.next = None\n\ndef getIntersectionNode(headA, headB):\n    p, q = headA, headB\n    while p != q:                      # 相遇时退出\n        p = p.next if p else headB     # 走完 A 就换到 B 的头部\n        q = q.next if q else headA     # 走完 B 就换到 A 的头部\n    return p                           # 交点 或 None"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(lenA + lenB)：两指针合计最多走两遍长度。空间复杂度 O(1)：只用两个指针。"]}, {"title": "核心知识点", "paragraphs": ["• 双指针「换头」技巧：通过让指针走完一条链后切换到另一条链，消除长度差。", "• 哈希表法（对照）：先遍历 A 把所有结点放进 set，再遍历 B 找第一个在 set 中的结点，思路更", "直观但空间 O(n)。", "• 链表结点比较用 is / == 判断「是否同一对象」，而不是比较 val，因为可能有重复值。", "• 相交是指「同一个结点对象」，而不是值相等。"]}]}, {"id": 206, "title": "反转链表", "difficulty": "简单", "category": 7, "page": 48, "sections": [{"title": "题目描述", "paragraphs": ["给你单链表的头节点 head，请你反转链表，并返回反转后的链表。", "示例：", "输入：head = [1,2,3,4,5]", "输出：[5,4,3,2,1]"]}, {"title": "解题思路", "paragraphs": ["这是链表最基础的题目，也是必须背下来的模板。核心是「三个指针」：", "- prev：已经反转好的那部分链表的头。", "- cur：当前正在处理的结点。", "- nxt：暂存 cur 的下一个结点（因为改完 cur.next 后就找不到后面的结点了）。", "具体步骤：", "1. prev = None，cur = head。", "2. 当 cur 不为空时循环：", "- 先存好 nxt = cur.next（保护现场）。", "- 把 cur.next 指向 prev（完成反转方向）。", "- prev = cur，cur = nxt（两个指针整体前移一格）。", "3. 循环结束时 cur 为 None，prev 就是新的头结点，返回 prev。", "务必按「先存、再改、后移」的顺序写，否则会断链。也可以用递归实现，但递归有栈深度风险。"]}, {"title": "参考代码", "code": "# 迭代法（推荐）\ndef reverseList(head):\n    prev = None\n    cur = head\n    while cur:\n        nxt = cur.next     # 1. 存好下一个结点\n        cur.next = prev    # 2. 反转指向\n        prev = cur         # 3. prev 前移\n        cur = nxt          # 4. cur 前移\n    return prev            # prev 成为新的头结点\n\n# 递归法（理解即可）\ndef reverseList2(head):\n    if not head or not head.next:\n        return head\n    new_head = reverseList2(head.next)  # 先反转后面的部分\n    head.next.next = head               # 让下一个结点指回自己\n    head.next = None                    # 自己成为新的尾巴\n    return new_head"}, {"title": "复杂度分析", "paragraphs": ["迭代法：时间 O(n)，空间 O(1)。递归法：时间 O(n)，空间 O(n)（递归调用栈）。"]}, {"title": "核心知识点", "paragraphs": ["• 三指针法：prev / cur / nxt，是链表操作中最基础也最重要的模板。", "• 「先存后改」原则：修改指针指向之前一定要先保存后续结点，否则会丢失后面的链表。", "• dummy 头结点的思路延伸：返回 prev 而不是 head，因为头结点已经变成了尾结点。", "• 递归的链表视角：假设「后面的部分已经反转好了」，只需处理当前结点与它的下一个结点的关系。", "• 衍生题：反转链表 II（92，区间反转）、K 个一组翻转链表（25）都建立在本题之上。"]}]}, {"id": 234, "title": "回文链表", "difficulty": "简单", "category": 7, "page": 50, "sections": [{"title": "题目描述", "paragraphs": ["给你一个单链表的头节点 head，请你判断该链表是否为回文链表。如果是，返回 true；否则，", "返回 false。", "示例：", "输入：head = [1,2,2,1]", "输出：true", "输入：head = [1,2]", "输出：false"]}, {"title": "解题思路", "paragraphs": ["方法一（简单，O(n) 空间）：把链表的值全部读进一个数组，再用双指针从两端向中间比较。", "方法二（进阶，O(1) 空间）：把链表的「后半段原地反转」，然后与前半段逐个比较。", "具体步骤：", "1. 用快慢指针找到中点：快指针每次走两步，慢指针每次走一步；快指针到终点时，慢指针正好", "在中点。", "2. 从慢指针处开始，把后半段链表反转（复用「反转链表」的模板）。", "3. 用两个指针分别从前半段开头和后半段开头出发，逐个比较值；全部相同则返回 true。", "4. （可选）把后半段再反转回来，恢复链表原状。", "奇偶长度处理：奇数长度时，中间那个结点两边都不影响比较，所以循环条件用「后半段指针不", "为空」即可。"]}, {"title": "参考代码", "code": "# 方法一: 转数组 + 双指针 (最易理解)\ndef isPalindrome(head):\n    vals = []\n    while head:\n        vals.append(head.val)\n        head = head.next\n    return vals == vals[::-1]\n\n# 方法二: 找中点 + 反转后半段 + 比较 (空间 O(1))\ndef isPalindrome2(head):\n    slow = fast = head\n    while fast and fast.next:      # 快慢指针找中点\n        slow = slow.next\n        fast = fast.next.next\n    # 反转从 slow 开始的后半段\n    prev = None\n    while slow:\n        nxt = slow.next\n        slow.next = prev\n        prev = slow\n        slow = nxt\n    # prev 是后半段的头, 与 head 逐个比较\n    left, right = head, prev\n    while right:\n        if left.val != right.val:\n            return False\n        left = left.next\n        right = right.next\n    return True"}, {"title": "复杂度分析", "paragraphs": ["方法一：时间 O(n)，空间 O(n)。方法二：时间 O(n)，空间 O(1)。"]}, {"title": "核心知识点", "paragraphs": ["• 快慢指针找中点：快指针走 2 步、慢指针走 1 步，是链表题中定位中点的标准做法。", "• 「反转后半段」的思想：把「从两端向中间比较」转化为「两段正向比较」，从而避免递归栈或额", "外数组。", "• 奇数长度自动兼容：多出来的中间结点不影响比较。", "• vals[::-1] 是 Python 反转序列的切片写法，简洁高效。"]}]}, {"id": 141, "title": "环形链表", "difficulty": "简单", "category": 7, "page": 52, "sections": [{"title": "题目描述", "paragraphs": ["给你一个链表的头节点 head，判断链表中是否有环。如果链表中有某个节点，可以通过连续跟踪", "next 指针再次到达，则链表中存在环。如果链表中存在环，则返回 true；否则返回 false。", "示例：", "输入：head = [3,2,0,-4], pos = 1", "输出：true", "解释：链表中有一个环，其尾部连接到下标为 1 的节点。"]}, {"title": "解题思路", "paragraphs": ["方法一（哈希表）：遍历链表，把走过的结点放进集合；如果再次遇到同一个结点，说明有环。", "方法二（快慢指针，又称 Floyd 判圈算法，空间 O(1)，是标准答案）：", "让快指针每次走 2 步、慢指针每次走 1 步。如果链表有环，快指针一定会在环内追上慢指针（相", "遇）；如果无环，快指针会先到达终点（null）。", "为什么一定会相遇？可以把过程想象成两个人在环形跑道上跑，速度快的人最终一定会「套圈」", "追上慢的人。", "具体步骤：", "1. slow = fast = head。", "2. 当 fast 和 fast.next 都不为空时循环：slow 走一步，fast 走两步。", "3. 若 slow == fast（是同一个结点），返回 true。", "4. 循环正常结束（fast 走到 null），说明无环，返回 false。"]}, {"title": "参考代码", "code": "def hasCycle(head):\n    slow = fast = head\n    while fast and fast.next:      # fast 能走两步才继续\n        slow = slow.next\n        fast = fast.next.next\n        if slow is fast:           # 相遇 -> 有环\n            return True\n    return False                   # 无环\n\n# 方法一: 哈希表 (空间 O(n), 更直观)\ndef hasCycle2(head):\n    seen = set()\n    while head:\n        if id(head) in seen:\n            return True\n        seen.add(id(head))\n        head = head.next\n    return False"}, {"title": "复杂度分析", "paragraphs": ["快慢指针：时间 O(n)（有环时慢指针最多走一圈），空间 O(1)。哈希表法：时间 O(n)，空间 O(n)。"]}, {"title": "核心知识点", "paragraphs": ["• Floyd 判圈算法（龟兔赛跑）：快慢指针是链表环检测的标准解法，空间 O(1)。", "• 循环条件 fast and fast.next：保证 fast.next.next 不会报空指针错误，这是必须写的守卫条件。", "• 「相遇」判断用 is 判断是否为同一对象，而不是比较值。", "• 为什么一定相遇（数学证明）：设环长为 L，两者距离每轮缩短 1，最终必然追上。"]}]}, {"id": 142, "title": "环形链表 II", "difficulty": "中等", "category": 7, "page": 53, "sections": [{"title": "题目描述", "paragraphs": ["给定一个链表的头节点 head，返回链表开始入环的第一个节点。如果链表无环，则返回 null。不", "允许修改链表。", "示例：", "输入：head = [3,2,0,-4], pos = 1", "输出：返回索引为 1 的链表节点"]}, {"title": "解题思路", "paragraphs": ["在第一题（判断有无环）的基础上，还要找出「入环点」。这里用到一个很漂亮的数学结论。", "设：头结点到入环点的距离是 a，入环点到相遇点的距离是 b，相遇点再回到入环点的距离是 c，", "环长 L = b + c。", "相遇时：慢指针走了 a + b，快指针走了 a + b + n×L（多绕了 n 圈）。又因为快指针速度是慢", "指针的 2 倍：", "2(a + b) = a + b + n×L  →  a = n×L - b = (n-1)×L + c", "结论：从「头结点」和从「相遇点」同时出发、速度相同，它们一定会在「入环点」相遇。", "具体步骤：", "1. 先用快慢指针找到相遇点（无环则返回 None）。", "2. 让一个指针从头结点出发，另一个从相遇点出发，每次都走一步。", "3. 它们相遇的位置就是入环点，返回该结点。"]}, {"title": "参考代码", "code": "def detectCycle(head):\n    slow = fast = head\n    while fast and fast.next:\n        slow = slow.next\n        fast = fast.next.next\n        if slow is fast:                 # 找到相遇点\n            p = head                     # 一个从头出发\n            q = slow                     # 一个从相遇点出发\n            while p is not q:\n                p = p.next\n                q = q.next\n            return p                     # 相遇处即入环点\n    return None                          # 无环"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n)：两次线性遍历。空间复杂度 O(1)。"]}, {"title": "核心知识点", "paragraphs": ["• Floyd 算法的第二阶段：相遇点 + 头结点同时出发找入环点，是本题的精髓。", "• 推导等式 2(a+b) = a+b+nL：把「速度关系」转化为「路程关系」，是解此题的关键一步。", "• a = (n-1)L + c 的几何含义：从头走 a 步等价于从相遇点走 c 步（再加上若干整圈），所以两者在", "入环点重合。", "• 哈希表法（对照）：记录首次重复访问的结点即为入环点，但空间 O(n)。"]}]}, {"id": 21, "title": "合并两个有序链表", "difficulty": "简单", "category": 7, "page": 55, "sections": [{"title": "题目描述", "paragraphs": ["将两个升序链表合并为一个新的升序链表并返回。新链表是通过拼接给定的两个链表的所有节点", "组成的。", "示例：", "输入：l1 = [1,2,4], l2 = [1,3,4]", "输出：[1,1,2,3,4,4]"]}, {"title": "解题思路", "paragraphs": ["思路和「归并排序的合并步骤」完全一致，用两个指针分别遍历两个链表，每次挑较小的结点接", "到结果链表尾部。", "具体步骤（用 dummy 虚拟头结点）：", "1. 建一个虚拟头结点 dummy，让 tail = dummy 作为结果链表的尾指针。", "2. 当两个链表都非空时：比较两指针的值，把较小的结点接到 tail.next，然后该指针前移。", "3. tail 也前移一格。", "4. 循环结束后，肯定有一条链表还没走完，直接接到 tail.next 上即可（剩下的一定是有序且都比", "已接的大）。", "5. 返回 dummy.next。", "dummy 结点的好处：不需要为「结果链表的第一个结点」写特殊判断，代码更统一。"]}, {"title": "参考代码", "code": "def mergeTwoLists(l1, l2):\n    dummy = ListNode(0)          # 虚拟头结点\n    tail = dummy\n    while l1 and l2:\n        if l1.val <= l2.val:     # 挑较小的\n            tail.next = l1\n            l1 = l1.next\n        else:\n            tail.next = l2\n            l2 = l2.next\n        tail = tail.next\n    tail.next = l1 if l1 else l2  # 接上剩余部分\n    return dummy.next"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(m + n)：每个结点被访问一次。空间复杂度 O(1)：只重新连接指针，不新建结点", "（dummy 除外）。"]}, {"title": "核心知识点", "paragraphs": ["• 虚拟头结点 dummy：链表题的头号利器，统一处理「第一个结点」的边界情况。", "• 双指针归并：与归并排序的 merge 步骤同源，是 O(n) 合并两个有序序列的标准做法。", "• 「直接接上剩余的链表」：不需要循环逐个搬运，是链表相对于数组的优势（O(1) 拼接）。", "• 衍生题：合并 K 个升序链表（23）——可以用分治两两合并，或用优先队列。"]}]}, {"id": 2, "title": "两数相加", "difficulty": "中等", "category": 7, "page": 56, "sections": [{"title": "题目描述", "paragraphs": ["给你两个非空的链表，表示两个非负的整数。它们每位数字都是按照逆序的方式存储的，并且每", "个节点只能存储一位数字。请你将两个数相加，并以相同形式返回一个表示和的链表。你可以假", "设除了数字 0 之外，这两个数都不会以 0 开头。", "示例：", "输入：l1 = [2,4,3], l2 = [5,6,4]", "输出：[7,0,8]", "解释：342 + 465 = 807，逆序存储即为 [7,0,8]。"]}, {"title": "解题思路", "paragraphs": ["本质就是「手算竖式加法」的链表版本。因为是逆序存储，正好可以从个位开始逐位相加，天然", "与进位方向一致。", "具体步骤：", "1. 建 dummy 头结点和 tail 指针，用 carry 保存进位（初始 0）。", "2. 当 l1 或 l2 还有结点，或者 carry 不为 0 时循环：", "- 取出 l1、l2 当前位的值（若为空则记为 0）。", "- s = v1 + v2 + carry。", "- 新结点的值 = s % 10，新的 carry = s // 10。", "- 接到结果链表尾部，并前移各指针。", "3. 返回 dummy.next。", "注意循环条件必须包含 carry != 0，否则最高位的进位会丢失（例如 5 + 5 = 10）。"]}, {"title": "参考代码", "code": "def addTwoNumbers(l1, l2):\n    dummy = ListNode(0)\n    tail = dummy\n    carry = 0                          # 进位\n    while l1 or l2 or carry:\n        v1 = l1.val if l1 else 0\n        v2 = l2.val if l2 else 0\n        s = v1 + v2 + carry\n        carry = s // 10                # 新的进位\n        tail.next = ListNode(s % 10)   # 当前位\n        tail = tail.next\n        if l1: l1 = l1.next\n        if l2: l2 = l2.next\n    return dummy.next"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(max(m, n))：遍历较长的链表长度。空间复杂度 O(max(m, n))：新建的结果链表长度。"]}, {"title": "核心知识点", "paragraphs": ["• 模拟竖式加法：逐位相加 + 进位传递，是「大数运算」类题目（字符串相加 415、二进制求和 67）", "的统一思路。", "• 循环条件的三个分支：l1、l2、carry 任意一个还存在就继续，这是不漏最高位进位的写法。", "• 空结点补 0：v1 = l1.val if l1 else 0，避免写两套循环。", "• 逆序存储的优势：正好从最低位开始算，与进位方向一致；若是正序存储（题 445）则需要先反转", "链表或借助栈。"]}]}, {"id": 19, "title": "删除链表的倒数第 N 个结点", "difficulty": "中等", "category": 7, "page": 58, "sections": [{"title": "题目描述", "paragraphs": ["给你一个链表，删除链表的倒数第 n 个结点，并且返回链表的头结点。进阶：你能尝试使用一趟", "扫描实现吗？", "示例：", "输入：head = [1,2,3,4,5], n = 2", "输出：[1,2,3,5]"]}, {"title": "解题思路", "paragraphs": ["因为要「一趟扫描」，不能先求长度再走 L-n 步。用「快慢指针 + 固定的间隔」来解决。", "具体步骤：", "1. 建虚拟头结点 dummy，让 dummy.next = head（这样删除头结点时也不需特殊处理）。", "2. 让 fast 和 slow 都从 dummy 出发。", "3. 先让 fast 向前走 n+1 步，这样 fast 和 slow 之间就隔了 n 个结点。", "4. 然后 fast 和 slow 同时每次走一步，直到 fast 走到 null。", "5. 此时 slow 正好停在「倒数第 n 个结点的前一个」，执行 slow.next = slow.next.next 完成删", "除。", "6. 返回 dummy.next。", "为什么走 n+1 步？因为我们要让 slow 停在待删结点的前一个位置，方便做删除操作。例如", "[1,2,3,4,5] 删倒数第 2 个（即 4），slow 应停在 3 上。"]}, {"title": "参考代码", "code": "def removeNthFromEnd(head, n):\n    dummy = ListNode(0)\n    dummy.next = head\n    fast = slow = dummy\n    for _ in range(n + 1):        # fast 先走 n+1 步\n        fast = fast.next\n    while fast:                   # 两指针同步前进\n        fast = fast.next\n        slow = slow.next\n    slow.next = slow.next.next    # 删除 slow 后面的结点\n    return dummy.next"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(L)：L 为链表长度，只遍历一趟。空间复杂度 O(1)。"]}, {"title": "核心知识点", "paragraphs": ["• 相隔固定距离的双指针：快指针先走 n+1 步，然后同步前进，就能一次定位倒数第 n 个结点。", "• dummy 虚拟头结点：处理「删除头结点」的边界情况，避免写 if head == 待删 的特殊分支。", "• 为什么是 n+1：为了让慢指针停在待删结点的「前驱」，这样才好改 next 指针。", "• 同款思想：找链表中点（快指针走两步）、找倒数第 k 个（本题），都是「固定间隔」的变体。"]}]}, {"id": 24, "title": "两两交换链表中的节点", "difficulty": "中等", "category": 7, "page": 59, "sections": [{"title": "题目描述", "paragraphs": ["给你一个链表，两两交换其中相邻的节点，并返回交换后链表的头节点。你必须在不修改节点内", "部的值的情况下完成本题（即，只能进行节点交换）。", "示例：", "输入：head = [1,2,3,4]", "输出：[2,1,4,3]"]}, {"title": "解题思路", "paragraphs": ["关键在于「画图理清指针顺序」。每次处理一对相邻结点 (a, b)，需要把 b 放到 a 前面，同时要", "让这一对的前驱 pre 指向 b、a 指向下一对的开头。", "具体步骤（以一对 [a, b]、前驱为 pre 为例）：", "1. 先记录下一对的开头 nxt = b.next。", "2. 让 pre.next = b（前驱指向新的第一个结点）。", "3. 让 b.next = a（b 指向 a）。", "4. 让 a.next = nxt（a 指向下一对）。", "5. 更新 pre = a，进入下一轮。", "指针修改的顺序很重要：如果先改 a.next 再改 pre.next，就会丢失 b 的位置。通用法则是「先", "保存将要被覆盖的信息，再修改指针」。"]}, {"title": "参考代码", "code": "def swapPairs(head):\n    dummy = ListNode(0)\n    dummy.next = head\n    pre = dummy                       # 当前这一对的前驱\n    while pre.next and pre.next.next:\n        a = pre.next\n        b = a.next\n        nxt = b.next                  # 1. 保存下一对的开头\n        pre.next = b                  # 2. 前驱 -> b\n        b.next = a                    # 3. b -> a\n        a.next = nxt                  # 4. a -> 下一对\n        pre = a                       # 5. 前驱移到本对末尾\n    return dummy.next"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n)：每个结点只访问一次。空间复杂度 O(1)：原地交换指针。"]}, {"title": "核心知识点", "paragraphs": ["• 画图理指针：链表指针变换类题目，务必先画出「修改前」和「修改后」的图，按图写代码。", "• 指针修改顺序：遵循「先保存、后覆盖」的原则，避免丢失结点引用。", "• 循环条件 pre.next and pre.next.next：保证至少还有两个结点可以交换，这是防止空指针的关键。", "• 递归写法（拓展）：把前两个结点交换后，递归处理剩下的链表，代码更简洁但空间 O(n)。"]}]}, {"id": 25, "title": "K 个一组翻转链表", "difficulty": "困难", "category": 7, "page": 61, "sections": [{"title": "题目描述", "paragraphs": ["给你链表的头节点 head，每 k 个节点一组进行翻转，请你返回修改后的链表。k 是一个正整数，", "它的值小于或等于链表的长度。如果节点总数不是 k 的整数倍，那么请将最后剩余的节点保持原", "有顺序。你不能只是单纯的改变节点内部的值，而是需要实际进行节点交换。", "示例：", "输入：head = [1,2,3,4,5], k = 2", "输出：[2,1,4,3,5]", "输入：head = [1,2,3,4,5], k = 3", "输出：[3,2,1,4,5]"]}, {"title": "解题思路", "paragraphs": ["这是「两两交换」的推广版：不再固定 2 个一组，而是每 k 个一组翻转。", "具体步骤：", "1. 用 dummy 头结点，pre 指向「上一组的尾结点」，初始化为 dummy。", "2. 每轮先检查「从 pre.next 开始是否还有 k 个结点」：用 end 指针从 pre 出发走 k 步，若中途", "为 null，说明剩余不足 k 个，直接结束（保持原顺序）。", "3. 记录 start = pre.next，nxt = end.next（下一组的起点，同时也是本组反转后的尾指向）。", "4. 把 [start, end] 这一段断开，做一次「反转链表」（标准三指针模板），得到 newHead、", "newTail。", "5. 把反转后的这一组接回去：pre.next = newHead，newTail.next = nxt。", "6. 更新 pre = newTail（即原来的 start），继续下一组。", "小技巧：可以把本组尾结点的 next 临时置为 None，这样可以直接调用反转函数，不用额外处理", "边界。"]}, {"title": "参考代码", "code": "def reverseKGroup(head, k):\n    dummy = ListNode(0)\n    dummy.next = head\n    pre = dummy                        # 上一组的尾结点\n\n    while True:\n        # 1. 检查剩余是否够 k 个\n        end = pre\n        for _ in range(k):\n            end = end.next\n            if not end:\n                return dummy.next      # 不足 k 个, 直接返回\n        nxt = end.next                 # 下一组的起点\n        start = pre.next\n        # 2. 反转 [start, end] 这一段\n        prev, cur = None, start\n        while cur is not nxt:\n            tmp = cur.next\n            cur.next = prev\n            prev = cur\n            cur = tmp\n        # 3. 接回链表: pre -> 本组新头(prev), 本组新尾(start).next = nxt\n        pre.next = prev\n        start.next = nxt\n        pre = start                    # 本组尾结点成为下一组的前驱\n    return dummy.next"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n)：每个结点被访问常数次。空间复杂度 O(1)：原地翻转。"]}, {"title": "核心知识点", "paragraphs": ["• 分组处理框架：先「判定本组是否足 k 个」，再「翻转本组」，最后「接回链表」，逻辑清晰不", "易错。", "• 复用反转模板：区间反转本质上就是一次「限定终点的反转链表」。", "• 临时断链与重连：把本组尾结点指向 None（或限定 cur 不为 nxt）可以直接套用标准反转代码。", "• pre / start / end / nxt 四指针分工：前驱、本组头、本组尾、下一组头，画图后一目了然。", "• 难度定位：Hot 100 中链表部分最难的一题，建议先把 206 和 92（区间反转）做熟再来。"]}]}, {"id": 138, "title": "随机链表的复制", "difficulty": "中等", "category": 7, "page": 63, "sections": [{"title": "题目描述", "paragraphs": ["给你一个长度为 n 的链表，每个节点包含一个额外增加的随机指针 random，该指针可以指向链", "表中的任何节点或空节点。构造这个链表的深拷贝。深拷贝应该正好由 n 个全新节点组成，其中", "每个新节点的值都设为其对应的原节点的值。新节点的 next 指针和 random 指针也都应指向复", "制链表中的新节点，并使原链表和复制链表中的这些指针能够表示相同的链表状态。复制链表中", "的指针都不应指向原链表中的节点。", "示例：", "输入：head = [[7,null],[13,0],[11,4],[10,2],[1,0]]", "输出：[[7,null],[13,0],[11,4],[10,2],[1,0]]"]}, {"title": "解题思路", "paragraphs": ["难点在于：新结点的 random 可能指向「还没创建」的结点。", "方法一（哈希表，最直观）：", "1. 第一趟遍历：为每个原结点创建一个新结点，用字典 map 建立「原结点 → 新结点」的映射。", "2. 第二趟遍历：设置新结点的 next 和 random，即 map[cur].next = map[cur.next]，", "map[cur].random = map[cur.random]（若 cur.random 为 None 则设为 None）。", "3. 返回 map[head]。", "方法二（原地拼接，空间 O(1)，进阶）：把每个新结点插到对应原结点后面", "（A→A'→B→B'→…），这样 A'.random = A.random.next 就能直接找到。最后再把两条链表", "拆开。", "初学建议先掌握方法一，思路清晰、不容易写错。"]}, {"title": "参考代码", "code": "# 方法一: 哈希表 (推荐, 思路清晰)\nclass Node:\n    def __init__(self, x, next=None, random=None):\n        self.val = x\n        self.next = next\n        self.random = random\n\ndef copyRandomList(head):\n    if not head:\n        return None\n    mp = {}\n    cur = head\n    while cur:                      # 第一趟: 建立 原结点 -> 新结点 的映射\n        mp[cur] = Node(cur.val)\n        cur = cur.next\n    cur = head\n    while cur:                      # 第二趟: 串接 next 和 random\n        mp[cur].next = mp.get(cur.next)\n        mp[cur].random = mp.get(cur.random)\n        cur = cur.next\n    return mp[head]\n\n# 方法二: 原地拼接 (空间 O(1))\ndef copyRandomList2(head):\n    if not head:\n        return None\n    cur = head\n    while cur:                      # 1. 在每个原结点后插入克隆结点\n        clone = Node(cur.val)\n        clone.next = cur.next\n        cur.next = clone\n        cur = clone.next\n    cur = head\n    while cur:                      # 2. 设置 random\n        if cur.random:\n            cur.next.random = cur.random.next\n        cur = cur.next.next\n    dummy = Node(0)\n    tail = dummy\n    cur = head\n    while cur:                      # 3. 拆分出克隆链表\n        tail.next = cur.next\n        tail = tail.next\n        cur.next = cur.next.next    # 恢复原链表\n        cur = cur.next\n    return dummy.next"}, {"title": "复杂度分析", "paragraphs": ["方法一：时间 O(n)，空间 O(n)。方法二：时间 O(n)，空间 O(1)（不计新建结点）。"]}, {"title": "核心知识点", "paragraphs": ["• 「原结点 → 新结点」映射表：处理「指针可能指向尚未创建的对象」这类问题的通用手段。", "• 深拷贝与浅拷贝：深拷贝要求所有引用都指向新对象，不能与原链表共享任何结点。", "• 两趟遍历策略：第一趟建结点、第二趟连指针，把复杂依赖拆成两步，大大降低难度。", "• mp.get(x) 的妙用：当 x 为 None 时返回 None，正好符合 random 可以为空的要求。", "• 原地拼接法（进阶）：利用「克隆结点紧跟原结点」的位置关系，用 cur.random.next 代替哈希", "查找。"]}]}, {"id": 148, "title": "排序链表", "difficulty": "中等", "category": 7, "page": 65, "sections": [{"title": "题目描述", "paragraphs": ["给你链表的头结点 head，请将其按升序排列并返回排序后的链表。进阶：你可以在 O(n log n)", "时间复杂度和常数级空间复杂度下，对链表进行排序吗？", "示例：", "输入：head = [4,2,1,3]", "输出：[1,2,3,4]"]}, {"title": "解题思路", "paragraphs": ["数组排序可以用快排，但链表不支持随机访问，快排的 partition 效率低。链表排序最适合「归并", "排序（自顶向下分治）」，因为链表的「拆分」和「合并」都是 O(1) 操作。", "具体步骤：", "1. 递归终止条件：链表为空或只有一个结点时，本身就是有序的，直接返回。", "2. 用「快慢指针」找到链表中点，并在中点处断开，得到左右两条子链表。", "3. 递归排序左半部分和右半部分。", "4. 把两个有序链表合并（复用「合并两个有序链表」的代码）。", "找中点的细节：快指针从 head.next 开始（而不是 head），这样当结点个数为 2 时，slow 会停", "在第一个结点，避免死循环（否则 split 出的左半可能等于原链表）。", "如果想做到空间 O(1)，需要用「自底向上」的迭代式归并：从长度为 1 的段开始，逐轮把段长翻", "倍。"]}, {"title": "参考代码", "code": "def sortList(head):\n    if not head or not head.next:\n        return head\n    # 1. 快慢指针找中点, fast 从 head.next 出发保证偶数长度时中点偏左\n    slow, fast = head, head.next\n    while fast and fast.next:\n        slow = slow.next\n        fast = fast.next.next\n    mid = slow.next\n    slow.next = None                 # 断开成两段\n    # 2. 递归排序\n    left = sortList(head)\n    right = sortList(mid)\n    # 3. 合并两个有序链表\n    dummy = ListNode(0)\n    tail = dummy\n    while left and right:\n        if left.val <= right.val:\n            tail.next = left\n            left = left.next\n        else:\n            tail.next = right\n            right = right.next\n        tail = tail.next\n    tail.next = left if left else right\n    return dummy.next"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n log n)：分治深度 log n，每层合并总代价 O(n)。空间复杂度 O(log n)：递归栈（自", "底向上迭代法可降到 O(1)）。"]}, {"title": "核心知识点", "paragraphs": ["• 链表归并排序：链表排序的最优选择，拆分/合并都是 O(1) 指针操作，无需额外数组。", "• 快慢指针找中点 + 断链：把链表拆成两半的标准手法。", "• 分治思想（Divide & Conquer）：把大问题拆成两个同类子问题，解决后合并。", "• fast 从 head.next 出发的技巧：保证偶数个结点时中点取左半边的末尾，避免无限递归。", "• 对比：数组排序可用快排（随机访问 O(1)），链表更适合归并（顺序访问即可）。"]}]}, {"id": 23, "title": "合并 K 个升序链表", "difficulty": "困难", "category": 7, "page": 66, "sections": [{"title": "题目描述", "paragraphs": ["给你一个链表数组，每个链表都已经按升序排列。请你将所有链表合并到一个升序链表中，返回", "合并后的链表。", "示例：", "输入：lists = [[1,4,5],[1,3,4],[2,6]]", "输出：[1,1,2,3,4,4,5,6]", "解释：将它们合并到一个有序链表中得到 1→1→2→3→4→4→5→6。"]}, {"title": "解题思路", "paragraphs": ["方法一（顺序两两合并，较慢）：把 lists[0] 和 lists[1] 合并，结果再和 lists[2] 合并……设最长链", "表长度为 n、链表个数为 k，则总复杂度 O(k²n)，当 k 大时会超时。", "方法二（分治两两合并，推荐）：模仿归并排序的思路，把 k 个链表两两配对合并，再对结果继", "续两两合并，直到只剩一个。合并轮数为 log k，总复杂度 O(kn log k)。", "方法三（优先队列 / 最小堆，也很常用）：", "1. 把所有链表的头结点放进一个小顶堆（按结点值比较）。", "2. 每次弹出堆顶（当前最小结点），接到结果链表尾部。", "3. 如果弹出的结点还有 next，就把 next 也放进堆。", "4. 堆空时结束。复杂度 O(kn log k)，但常数比方法二略大。", "Python 中用 heapq 实现堆；由于结点无法直接比较，需要存 (val, 唯一序号, 结点) 三元组。"]}, {"title": "参考代码", "code": "import heapq\n\n# 方法二: 分治两两合并 (推荐)\ndef mergeKLists(lists):\n    if not lists:\n        return None\n\n    def merge2(a, b):              # 合并两个有序链表\n        dummy = ListNode(0)\n        tail = dummy\n        while a and b:\n            if a.val <= b.val:\n                tail.next, a = a, a.next\n            else:\n                tail.next, b = b, b.next\n            tail = tail.next\n        tail.next = a if a else b\n        return dummy.next\n\n    while len(lists) > 1:          # 每轮两两合并\n        merged = []\n        for i in range(0, len(lists), 2):\n            if i + 1 < len(lists):\n                merged.append(merge2(lists[i], lists[i + 1]))\n            else:\n                merged.append(lists[i])\n        lists = merged\n    return lists[0]\n\n# 方法三: 最小堆\ndef mergeKLists2(lists):\n    heap = []\n    for i, node in enumerate(lists):\n        if node:\n            heapq.heappush(heap, (node.val, i, node))\n    dummy = ListNode(0)\n    tail = dummy\n    while heap:\n        val, i, node = heapq.heappop(heap)\n        tail.next = node\n        tail = tail.next\n        if node.next:\n            heapq.heappush(heap, (node.next.val, i, node.next))\n    return dummy.next"}, {"title": "复杂度分析", "paragraphs": ["分治法：时间 O(kn log k)，空间 O(log k)（递归/循环层数）。堆方法：时间 O(kn log k)，空间", "O(k)。"]}, {"title": "核心知识点", "paragraphs": ["• 分治合并：把 k 路合并拆成 log k 轮两两合并，是降低复杂度的核心思路。", "• 优先队列（最小堆）：多路归并的标准工具，「每次取全局最小」正是堆的强项。", "• 元组比较问题：堆元素需要可比较，存入 (val, 唯一序号, 结点)，序号用于避免结点之间的比较。", "• 复杂度对比：顺序合并 O(k²n) vs 分治/堆 O(kn log k)，k 较大时差距非常明显。", "• 方法论：一道题多种解法时，要能说清「哪种更好、好在哪里」——这是面试的高频考点。"]}]}, {"id": 146, "title": "LRU 缓存", "difficulty": "中等", "category": 7, "page": 68, "sections": [{"title": "题目描述", "paragraphs": ["请你设计并实现一个满足 LRU（最近最少使用）缓存约束的数据结构。", "实现 LRUCache 类：", "LRUCache(int capacity) 以正整数作为容量 capacity 初始化 LRU 缓存；", "int get(int key) 如果关键字存在，则返回其值，否则返回 -1；", "void put(int key, int value) 如果关键字已存在，则变更其值；否则插入该组。如果插入超出容量，", "则逐出最久未使用的关键字。", "函数 get 和 put 必须以 O(1) 的平均时间复杂度运行。", "示例：", "输入：[\"LRUCache\",\"put\",\"put\",\"get\",\"put\",\"get\",\"put\",\"get\",\"get\",\"get\"]", "[[2],[1,1],[2,2],[1],[3,3],[2],[4,4],[1],[3],[4]]", "输出：[null,null,null,1,null,-1,null,-1,3,4]"]}, {"title": "解题思路", "paragraphs": ["要求 O(1) 的查询和 O(1) 的「更新最近使用顺序」，单一数据结构做不到，需要「哈希表 + 双向", "链表」组合：", "- 哈希表：实现 key → 结点的 O(1) 定位。", "- 双向链表：维护「使用顺序」。链表头部放最近使用的，尾部放最久未使用的。", "- 访问一个 key：把对应结点移动到头部。", "- 插入新 key：若超出容量，先删掉尾部结点（最久未使用），再把新结点插到头部。", "为什么用双向链表？因为需要在 O(1) 时间内「删除任意一个结点」，只有双向链表有这个能力", "（单链表需要找前驱）。", "实现技巧：用两个「哨兵结点」head 和 tail 组成空的双向链表，可以省掉大量空指针判断。", "Python 中也可以用 OrderedDict（有序字典）直接实现，非常简洁，但面试通常要求手写双向", "链表。"]}, {"title": "参考代码", "code": "# 手写哈希表 + 双向链表 (标准答案)\nclass DNode:\n    def __init__(self, key=0, val=0):\n        self.key = key\n        self.val = val\n        self.prev = None\n        self.next = None\n\nclass LRUCache:\n    def __init__(self, capacity):\n        self.cap = capacity\n        self.cache = {}                     # key -> DNode\n        self.head = DNode()                 # 哨兵: 头部=最近使用\n        self.tail = DNode()                 # 哨兵: 尾部=最久未使用\n        self.head.next = self.tail\n        self.tail.prev = self.head\n\n    def _remove(self, node):                 # 从链表中摘下 node\n        node.prev.next = node.next\n        node.next.prev = node.prev\n\n    def _add_to_head(self, node):            # 把 node 插到头部\n        node.next = self.head.next\n        node.prev = self.head\n        self.head.next.prev = node\n        self.head.next = node\n\n    def get(self, key):\n        if key not in self.cache:\n            return -1\n        node = self.cache[key]\n        self._remove(node)                   # 移到头部表示刚使用过\n        self._add_to_head(node)\n        return node.val\n\n    def put(self, key, value):\n        if key in self.cache:\n            node = self.cache[key]\n            node.val = value\n            self._remove(node)\n            self._add_to_head(node)\n        else:\n            if len(self.cache) == self.cap:  # 容量满, 淘汰最久未使用\n                lru = self.tail.prev\n                self._remove(lru)\n                del self.cache[lru.key]\n            node = DNode(key, value)\n            self.cache[key] = node\n            self._add_to_head(node)\n\n# 方法二：直接用 OrderedDict (面试可用作对比说明)\nfrom collections import OrderedDict\n\nclass LRUCache2:\n    def __init__(self, capacity):\n        self.cap = capacity\n        self.od = OrderedDict()\n\n    def get(self, key):\n        if key not in self.od:\n            return -1\n        self.od.move_to_end(key)   # 移到末尾表示最近使用\n        return self.od[key]\n\n    def put(self, key, value):\n        if key in self.od:\n            self.od.move_to_end(key)\n        self.od[key] = value\n        if len(self.od) > self.cap:\n            self.od.popitem(last=False)  # 弹出最早使用的"}, {"title": "复杂度分析", "paragraphs": ["get 和 put 均为 O(1)：哈希查找 O(1)，双向链表的插入/删除 O(1)。空间复杂度 O(capacity)。"]}, {"title": "核心知识点", "paragraphs": ["• 哈希表 + 双向链表的组合设计：查询快 + 顺序可维护，这是工程中最经典的缓存实现。", "• 为什么需要双向链表：O(1) 删除任意结点必须知道前驱，单链表做不到。", "• 哨兵结点（sentinel）：用头尾两个虚拟结点消除边界判断，是双向链表实现的标准技巧。", "• LRU 淘汰策略：最久未被访问的（链表尾部）优先淘汰，每次访问都把结点提到头部。", "• 同类题：LFU 缓存（460）——按访问频率淘汰，需要更复杂的结构。"]}]}, {"id": 94, "title": "二叉树的中序遍历", "difficulty": "简单", "category": 8, "page": 72, "sections": [{"title": "题目描述", "paragraphs": ["给定一个二叉树的根节点 root，返回它的中序遍历结果。中序遍历的顺序是：左子树 → 根节点", "→ 右子树。", "示例：", "输入：root = [1,null,2,3]", "输出：[1,3,2]"]}, {"title": "解题思路", "paragraphs": ["中序遍历的三种写法都要掌握，因为面试中经常被要求「不用递归」。", "递归法：写一个函数，先递归左子树，再访问根，最后递归右子树。", "迭代法（用显式栈模拟递归）：", "1. 用一个栈和一个指针 cur（初始为 root）。", "2. 当 cur 不为空或栈不为空时循环：", "- 不断把 cur 压栈并令 cur = cur.left，一直走到最左边。", "- 弹出栈顶结点，访问它（加入结果）。", "- 令 cur = 弹出结点的 right，开始处理右子树。", "还有一个「Morris 遍历」可以在 O(1) 空间完成，原理是利用叶子结点的空指针建立临时线索，", "属于进阶内容。"]}, {"title": "参考代码", "code": "# 递归法\ndef inorderTraversal(root):\n    res = []\n    def dfs(node):\n        if not node:\n            return\n        dfs(node.left)          # 左\n        res.append(node.val)    # 根\n        dfs(node.right)         # 右\n    dfs(root)\n    return res\n\n# 迭代法 (显式栈)\ndef inorderTraversal2(root):\n    res, stack = [], []\n    cur = root\n    while cur or stack:\n        while cur:              # 一路向左\n            stack.append(cur)\n            cur = cur.left\n        cur = stack.pop()       # 弹出最左的结点\n        res.append(cur.val)\n        cur = cur.right         # 转向右子树\n    return res"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n)：每个结点访问一次。空间复杂度 O(h)：h 为树高，递归栈或显式栈的深度。"]}, {"title": "核心知识点", "paragraphs": ["• 递归三要素：确定递归函数的含义、终止条件、以及单层逻辑（本题是「左-根-右」）。", "• 用栈模拟递归：所有递归算法都能改写成迭代 + 栈的形式，这是面试常考的点。", "• 三种遍历的差别只在「访问根的位置」：前序（根左右）、中序（左根右）、后序（左右根）。", "• BST 的中序遍历有序 —— 这是二叉搜索树题目的核心性质，务必牢记。"]}]}, {"id": 104, "title": "二叉树的最大深度", "difficulty": "简单", "category": 8, "page": 74, "sections": [{"title": "题目描述", "paragraphs": ["给定一个二叉树 root，返回其最大深度。最大深度是指从根节点到最远叶子节点的最长路径上的", "节点数。", "示例：", "输入：root = [3,9,20,null,null,15,7]", "输出：3"]}, {"title": "解题思路", "paragraphs": ["方法一（递归 / DFS，推荐）：一棵树的最大深度 = max(左子树深度, 右子树深度) + 1。", "递归终止条件：空结点深度为 0。", "方法二（BFS 层序遍历）：一层一层地处理，每处理完一层就把层数加一，最后一层的层数就是", "最大深度。", "递归的思路非常简洁：「把问题交给左右子树，自己只负责把结果加一」，这就是二叉树递归的", "典型思维方式。"]}, {"title": "参考代码", "code": "# 递归 (DFS)\ndef maxDepth(root):\n    if not root:\n        return 0\n    return max(maxDepth(root.left), maxDepth(root.right)) + 1\n\n# 层序遍历 (BFS)\nfrom collections import deque\n\ndef maxDepth2(root):\n    if not root:\n        return 0\n    q = deque([root])\n    depth = 0\n    while q:\n        for _ in range(len(q)):     # 逐层处理\n            node = q.popleft()\n            if node.left: q.append(node.left)\n            if node.right: q.append(node.right)\n        depth += 1\n    return depth"}, {"title": "复杂度分析", "paragraphs": ["递归法：时间 O(n)，空间 O(h)。BFS 法：时间 O(n)，空间 O(n)（最宽一层的结点数）。"]}, {"title": "核心知识点", "paragraphs": ["• 「后序位置」的递归：先拿到左右子树的结果，再汇总成自己的结果（自底向上）。", "• 树高与空间复杂度：递归栈深度等于树高 h，最坏（退化成链）为 O(n)，平衡树为 O(log n)。", "• 层序遍历按层处理的写法：for _ in range(len(q)) 保证一次只处理当前层，是 BFS 的标准模板。", "• 这是理解「递归返回值」最好的入门题：返回值 = 以该结点为根的子树深度。"]}]}, {"id": 226, "title": "翻转二叉树", "difficulty": "简单", "category": 8, "page": 75, "sections": [{"title": "题目描述", "paragraphs": ["给你一棵二叉树的根节点 root，翻转这棵二叉树，并返回其根节点。翻转是指交换每个结点的左", "右子树。", "示例：", "输入：root = [4,2,7,1,3,6,9]", "输出：[4,7,2,9,6,3,1]"]}, {"title": "解题思路", "paragraphs": ["对树中的每一个结点，交换它的左右孩子即可。遍历方式可以用前序、后序或层序，只要「每个", "结点都被处理一次」就行。", "递归步骤：", "1. 终止条件：结点为空则返回。", "2. 交换当前结点的左右孩子。", "3. 递归翻转左子树、右子树。", "注意：交换操作放在「递归之前」还是「之后」都可以（前序/后序都行），但放在「中序」位置", "会出问题——因为中序会先处理左子树，交换后原来的左子树变成了右子树，会导致某些结点被", "处理两次。"]}, {"title": "参考代码", "code": "# 递归 (前序)\ndef invertTree(root):\n    if not root:\n        return None\n    root.left, root.right = root.right, root.left   # 交换左右孩子\n    invertTree(root.left)\n    invertTree(root.right)\n    return root\n\n# 层序遍历 (BFS)\nfrom collections import deque\n\ndef invertTree2(root):\n    if not root:\n        return None\n    q = deque([root])\n    while q:\n        node = q.popleft()\n        node.left, node.right = node.right, node.left\n        if node.left: q.append(node.left)\n        if node.right: q.append(node.right)\n    return root"}, {"title": "复杂度分析", "paragraphs": ["时间复杂度 O(n)：每个结点访问一次。空间复杂度 O(h)（递归）或 O(n)（BFS）。"]}, {"title": "核心知识点", "paragraphs": ["• 递归遍历的三种位置：前序（进入结点时处理）、中序（处理完左子树后）、后序（处理完左右子", "树后）。", "• 为什么中序不行：交换会改变「左子树」的含义，导致同一结点被访问两次。这是本题最容易被忽", "略的坑。", "• 树形结构的修改往往可以「就地」完成，不需要新建结点。", "• 经典趣闻：本题因某位工程师未能写出而走红，被戏称为「Homebrew 之树」，是面试热身必备", "题。"]}]}, {"id": 101, "title": "对称二叉树", "difficulty": "简单", "category": 8, "page": 77, "sections": [{"title": "题目描述", "paragraphs": ["给你一个二叉树的根节点 root，检查它是否轴对称。", "示例：", "输入：root = [1,2,2,3,4,4,3]", "输出：true", "输入：root = [1,2,2,null,3,null,3]", "输出：false"]}, {"title": "解题思路", "paragraphs": ["判断「整棵树是否对称」，本质是判断「左子树和右子树是否互为镜像」。", "所以需要写一个「比较两棵树是否镜像」的辅助函数，而不是比较「两棵树是否相同」。", "镜像比较的判断条件（设两结点为 p、q）：", "1. 都为空 → 对称，返回 tr
